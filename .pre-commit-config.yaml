exclude: ^benchmarks/agent_evaluation/retained/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: source-hygiene
        name: Python source hygiene (LF + syntax)
        entry: python3 scripts/source_hygiene.py
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff blocking correctness
        entry: env UV_PROJECT_ENVIRONMENT=.ruff-venv uv run --frozen --only-group lint ruff check --fix --select E4,E7,E9,I,T201
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: env UV_PROJECT_ENVIRONMENT=.ruff-venv uv run --frozen --only-group lint ruff format
        language: system
        types_or: [python, pyi]

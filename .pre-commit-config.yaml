exclude: ^benchmarks/agent_evaluation/retained/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(helm/|catalog-info\.yaml)
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run --isolated --only-group lint --resolution highest --upgrade-package ruff ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run --isolated --only-group lint --resolution highest --upgrade-package ruff ruff format
        language: system
        types: [python]
      - id: ty-check
        name: ty-check
        entry: make ty-check
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright
        entry: make pyright-check
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

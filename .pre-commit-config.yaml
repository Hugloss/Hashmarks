exclude: ^benchmarks/agent_evaluation/retained/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: env UV_PROJECT_ENVIRONMENT=.ruff-venv uv run --only-group lint ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: env UV_PROJECT_ENVIRONMENT=.ruff-venv uv run --only-group lint ruff format
        language: system
        types_or: [python, pyi]

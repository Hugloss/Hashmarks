name: Behavior preserving experiment set qualification

on:
  push:
    branches:
      - behavior-preserving-experiment-set-replication

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv python install 3.11
      - name: Focused behavior tests
        run: uv run --group test pytest -q tests/test_agent_experiment_set_metrics.py
      - name: Repository Ruff gate
        run: make ruff
      - name: Repository test gate
        run: make test
      - name: Exact quality debt remeasurement
        run: |
          UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11
          curl -fsSL https://raw.githubusercontent.com/Hugloss/agentsCookbook/ecec3e3e6f50c3b954d25d651fc25417591240a9/scripts/bootstrap-agent-economics.sh -o /tmp/bootstrap-agent-economics.sh
          sh /tmp/bootstrap-agent-economics.sh --revision ecec3e3e6f50c3b954d25d651fc25417591240a9 --destination .agent-economics
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics quality-debt --repository-root . --root hashmarks --root scripts --root benchmarks --exclude benchmarks/agent_evaluation/retained --limit C901=8 --limit PLR0911=6 --limit PLR0912=8 --limit PLR0913=6 --limit PLR0914=15 --limit PLR0915=40 --limit PLR0916=5 --max-file-lines 1600 --file-line-root hashmarks --format json > /tmp/debt.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/debt.json").read_text())
          s=p["derived"]["summary"]
          print("POST_DEBT_EXCESS="+str(s["excess"]))
          for i,c in enumerate(p["candidates"][:20],1):
              f=c["facts"]
              print(f"{i:02d} {c['target']} excess={f['excess']} locations={f['locations']} rule_findings={f['rule_findings']}")
          print("TARGET_FINDINGS")
          for row in p["evidence"]["detailed_findings"]:
              if row["path"]=="scripts/agent_evaluation/metrics_agent_experiment_set.py":
                  print(json.dumps(row,sort_keys=True))
          PY

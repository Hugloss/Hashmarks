name: Fresh main debt remeasure

on:
  push:
    branches:
      - fresh-main-debt-remeasure

permissions:
  contents: read

jobs:
  remeasure:
    name: Remeasure current debt from fresh main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv python install 3.11
      - name: Materialize exact Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11
      - name: Bootstrap exact Agent Economics revision
        run: |
          curl -fsSL https://raw.githubusercontent.com/Hugloss/agentsCookbook/78b68603a8b65f3a17c5e2e4dcefb1750114bc28/scripts/bootstrap-agent-economics.sh -o /tmp/bootstrap-agent-economics.sh
          sh /tmp/bootstrap-agent-economics.sh \
            --revision 78b68603a8b65f3a17c5e2e4dcefb1750114bc28 \
            --destination .agent-economics
      - name: Measure current quality debt
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/current-quality-debt.json \
            --format json > /tmp/current-quality-debt.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-quality-debt.json").read_text())
          summary = payload["derived"]["summary"]
          print("FRESH_MAIN_SOURCE_IDENTITY=" + payload["repository"]["identity"])
          print("QUALITY_DEBT_EXCESS=" + str(summary["excess"]))
          print("QUALITY_DEBT_LOCATIONS=" + str(summary["locations"]))
          print("QUALITY_DEBT_RULE_FINDINGS=" + str(summary["rule_findings"]))
          print("QUALITY_DEBT_FILE_COUNT=" + str(len(summary["files"])))
          print("QUALITY_DEBT_TOP_CANDIDATES")
          for index, candidate in enumerate(payload["candidates"][:20], 1):
              facts = candidate["facts"]
              print(
                  f"{index:02d} {candidate['target']} "
                  f"excess={facts['excess']} "
                  f"locations={facts['locations']} "
                  f"rule_findings={facts['rule_findings']}"
              )
          PY
      - name: Select only the fresh-measured candidate
        run: |
          target=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-quality-debt.json").read_text())
          print(payload["candidates"][0]["target"])
          PY
          )
          printf 'CURRENT_TARGET=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'CURRENT_TARGET=%s\n' "$target"
      - name: Show exact debt in the fresh candidate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-quality-debt.json").read_text())
          target = os.environ["CURRENT_TARGET"]
          print("CURRENT_TARGET_DETAILED_FINDINGS")
          for row in payload["evidence"]["detailed_findings"]:
              if row["path"] == target:
                  print(
                      f"line={row['line']} rule={row['rule']} "
                      f"observed={row['observed']} limit={row['limit']} excess={row['excess']}"
                  )
          PY
      - name: Refresh test ownership without declarations
        run: |
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --changed-path "$CURRENT_TARGET" \
            --gate "ruff=make ruff" \
            --gate "test=make test" \
            --artifact .agent-artifacts/current-test-focus-unassisted.json \
            --format json > /tmp/current-test-focus-unassisted.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-test-focus-unassisted.json").read_text())
          candidate = payload["candidates"][0]
          print("UNASSISTED_TEST_FOCUS_CONFIRMED_DIRECT=" + str(candidate["derived"]["confirmed_direct_test_count"]))
          print("UNASSISTED_TEST_FOCUS_REQUIRED_NEXT_EVIDENCE=" + json.dumps(payload["required_next_evidence"], sort_keys=True))
          PY
      - name: Bind reviewed current public-API behavior owners
        run: |
          cat > /tmp/task-action-ownership.json <<'JSON'
          {
            "version": 1,
            "relationships": [
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_map.py",
                "reason": "current test directly exercises task_action_map public behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_brief.py",
                "reason": "current test exercises task_action_map through task_action_brief and direct call-count behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_session_reuse.py",
                "reason": "current test directly exercises task_action_map decision-session cache behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_stale_workspace.py",
                "reason": "current test directly exercises task_action_map stale-workspace authority behavior"
              }
            ]
          }
          JSON
      - name: Refresh test ownership with reviewed current evidence
        run: |
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --changed-path "$CURRENT_TARGET" \
            --ownership-hints-path /tmp/task-action-ownership.json \
            --gate "ruff=make ruff" \
            --gate "test=make test" \
            --artifact .agent-artifacts/current-test-focus.json \
            --format json > /tmp/current-test-focus.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-test-focus.json").read_text())
          candidate = payload["candidates"][0]
          print("TEST_FOCUS_REPOSITORY_IDENTITY=" + payload["repository"]["identity"])
          print("TEST_FOCUS_TARGET=" + candidate["target"])
          print("TEST_FOCUS_CONFIRMED_DIRECT=" + str(candidate["derived"]["confirmed_direct_test_count"]))
          print("TEST_FOCUS_SUPPORTING=" + str(candidate["derived"]["supporting_relationship_count"]))
          print("TEST_FOCUS_CONFIRMED_TESTS")
          for row in candidate["evidence"]["confirmed"]:
              print(
                  f"{row.get('test_path','')} "
                  f"match_type={row.get('match_type','')} "
                  f"provenance={row.get('provenance','')}"
              )
          print("TEST_FOCUS_REQUIRED_NEXT_EVIDENCE=" + json.dumps(payload["required_next_evidence"], sort_keys=True))
          print("TEST_FOCUS_UNCERTAINTY=" + json.dumps(payload["uncertainty"], sort_keys=True))
          PY
      - name: Materialize test supply
        run: uv sync --group test --python 3.11
      - name: Execute bound pre-edit behavioral tests
        run: |
          uv run --frozen --no-sync --group test python -m pytest -q \
            tests/test_task_action_map.py \
            tests/test_task_action_brief.py \
            tests/test_task_action_session_reuse.py \
            tests/test_task_action_stale_workspace.py
          echo "PRE_EDIT_BEHAVIOR_TESTS=PASS"
      - name: Evaluate BP1 pre-edit behavior readiness
        run: |
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from agent_economics.behavior_preservation import behavior_preservation_readiness

          target = Path(os.environ["CURRENT_TARGET"])
          source_identity = "sha256:" + hashlib.sha256(target.read_bytes()).hexdigest()
          test_paths = [
              Path("tests/test_task_action_map.py"),
              Path("tests/test_task_action_brief.py"),
              Path("tests/test_task_action_session_reuse.py"),
              Path("tests/test_task_action_stale_workspace.py"),
          ]
          test_references = [
              {
                  "path": path.as_posix(),
                  "evidence_identity": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in test_paths
          ]
          review_semantic = {
              "target": target.as_posix(),
              "source_identity": source_identity,
              "tests": test_references,
              "boundaries": [
                  "canonical-ranking-and-role-projection",
                  "owner-resolution-and-ambiguity-fail-closed",
                  "decision-session-cache-isolation",
                  "stale-workspace-authority-reconciliation",
                  "task-action-brief-consumer-contract",
              ],
          }
          review_identity = "sha256:" + hashlib.sha256(
              json.dumps(review_semantic, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          boundaries = [
              {
                  "identity": name,
                  "classification": "direct",
                  "freshness": "fresh",
                  "provider_reference": {
                      "provider": "hashmarks-current-public-api-test-review",
                      "evidence_identity": review_identity,
                  },
              }
              for name in review_semantic["boundaries"]
          ]
          execution_semantic = {
              "source_identity": source_identity,
              "test_evidence_identities": sorted(
                  row["evidence_identity"] for row in test_references
              ),
              "command": (
                  "uv run --frozen --no-sync --group test python -m pytest -q "
                  "tests/test_task_action_map.py tests/test_task_action_brief.py "
                  "tests/test_task_action_session_reuse.py tests/test_task_action_stale_workspace.py"
              ),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          execution_identity = "sha256:" + hashlib.sha256(
              json.dumps(execution_semantic, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          receipt = {
              "source_identity": source_identity,
              "status": "PASS",
              "test_evidence_identities": sorted(
                  row["evidence_identity"] for row in test_references
              ),
              "execution_identity": execution_identity,
          }
          result = behavior_preservation_readiness(
              target=target.as_posix(),
              source_identity=source_identity,
              boundaries=boundaries,
              test_references=test_references,
              execution_receipt=receipt,
              repository_gates=[
                  {"name": "ruff", "command": "make ruff"},
                  {"name": "test", "command": "make test"},
              ],
          )
          Path("/tmp/pre-edit-readiness.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print("PRE_EDIT_SOURCE_IDENTITY=" + source_identity)
          print("PRE_EDIT_REVIEW_IDENTITY=" + review_identity)
          print("PRE_EDIT_EXECUTION_IDENTITY=" + execution_identity)
          print("PRE_EDIT_READINESS_STATUS=" + str(result["status"]))
          print("PRE_EDIT_EVIDENCE_IDENTITY=" + str(result["evidence_identity"]))
          print("PRE_EDIT_UNRESOLVED=" + json.dumps(result["unresolved_evidence"], sort_keys=True))
          print("PRE_EDIT_STRENGTHENING=" + json.dumps(result["boundaries_requiring_test_strengthening"], sort_keys=True))
          if result["status"] != "READY_FOR_BEHAVIOR_PRESERVING_EDIT":
              raise SystemExit("pre-edit behavior evidence is not ready")
          PY
      - name: Measure current investigation hotspots
        run: |
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics hotspot-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --top 20 \
            --artifact .agent-artifacts/current-hotspots.json \
            --format json > /tmp/current-hotspots.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/current-hotspots.json").read_text())
          print("HOTSPOT_TOP_CANDIDATES")
          for index, candidate in enumerate(payload["candidates"][:20], 1):
              facts = candidate["facts"]
              print(
                  f"{index:02d} {candidate['target']} "
                  f"churn={facts['churn_commits']} "
                  f"fan_in={facts['fan_in']} "
                  f"branches={facts['branch_points']} "
                  f"lines={facts['source_lines']} "
                  f"confirmed_tests={facts['confirmed_tests']}"
              )
          PY

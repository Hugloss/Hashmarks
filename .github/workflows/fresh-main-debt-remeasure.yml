name: Fresh main debt remeasure

on:
  push:
    branches:
      - fresh-main-debt-remeasure

permissions:
  contents: read

jobs:
  remeasure:
    name: Close frozen edit and select next from fresh debt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FROZEN_TARGET: hashmarks/codemap/task_action_projection.py
      FROZEN_BASE_COMMIT: 5e3e07201e1fddc8fd5e949a62f369e19b81541e
      FROZEN_PRE_EDIT_SOURCE_IDENTITY: sha256:4494673387c248c3c482051b39d770d4f252610e9f87faf08fae22a92e8ac428
      FROZEN_PRE_EDIT_REVIEW_IDENTITY: sha256:8788b0dee3da893e99013ecdbfc14a2fef75500db9935fcf2ac171fbe37e7b5b
      FROZEN_PRE_EDIT_EXECUTION_IDENTITY: sha256:db34740a465f4d8ebd47b74964c86a5034d7b77e960e5417d43e5edd723ef726
      FROZEN_PRE_EDIT_EVIDENCE_IDENTITY: sha256:3d6adb7e150a98e2cf3531964ced71d454ef1015a9da86de593df97e67574dde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv python install 3.11
      - name: Materialize verification supply
        run: |
          UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11
          uv sync --group test --python 3.11
      - name: Bootstrap frozen Agent Economics revision
        run: |
          curl -fsSL https://raw.githubusercontent.com/Hugloss/agentsCookbook/78b68603a8b65f3a17c5e2e4dcefb1750114bc28/scripts/bootstrap-agent-economics.sh -o /tmp/bootstrap-agent-economics.sh
          sh /tmp/bootstrap-agent-economics.sh \
            --revision 78b68603a8b65f3a17c5e2e4dcefb1750114bc28 \
            --destination .agent-economics
      - name: Remeasure current debt and select next candidate
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/current-quality-debt.json \
            --format json > /tmp/current-quality-debt.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/current-quality-debt.json").read_text())
          summary = payload["derived"]["summary"]
          next_candidate = payload["candidates"][0]
          frozen = next(
              row for row in payload["candidates"]
              if row["target"] == "hashmarks/codemap/task_action_projection.py"
          )
          print("CURRENT_REPOSITORY_IDENTITY=" + payload["repository"]["identity"])
          print("QUALITY_DEBT_EXCESS=" + str(summary["excess"]))
          print("QUALITY_DEBT_LOCATIONS=" + str(summary["locations"]))
          print("QUALITY_DEBT_RULE_FINDINGS=" + str(summary["rule_findings"]))
          print("NEXT_TARGET=" + next_candidate["target"])
          print("NEXT_TARGET_EXCESS=" + str(next_candidate["facts"]["excess"]))
          print("FROZEN_TARGET_POST_EDIT_EXCESS=" + str(frozen["facts"]["excess"]))
          print("QUALITY_DEBT_TOP_CANDIDATES")
          for index, candidate in enumerate(payload["candidates"][:20], 1):
              facts = candidate["facts"]
              print(
                  f"{index:02d} {candidate['target']} "
                  f"excess={facts['excess']} "
                  f"locations={facts['locations']} "
                  f"rule_findings={facts['rule_findings']}"
              )
          if int(summary["excess"]) >= 1989:
              raise SystemExit("repository debt did not improve from frozen pre-edit measurement")
          if int(frozen["facts"]["excess"]) >= 151:
              raise SystemExit("frozen target debt did not improve from pre-edit measurement")
          PY
      - name: Bind frozen target to reviewed current public-API tests
        run: |
          cat > /tmp/task-action-ownership.json <<'JSON'
          {
            "version": 1,
            "relationships": [
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_map.py",
                "reason": "current test directly exercises task_action_map public behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_brief.py",
                "reason": "current test exercises task_action_map through task_action_brief and direct call-count behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_session_reuse.py",
                "reason": "current test directly exercises task_action_map decision-session cache behavior"
              },
              {
                "source": "hashmarks/codemap/task_action_projection.py",
                "test": "tests/test_task_action_stale_workspace.py",
                "reason": "current test directly exercises task_action_map stale-workspace authority behavior"
              }
            ]
          }
          JSON
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --changed-path "$FROZEN_TARGET" \
            --ownership-hints-path /tmp/task-action-ownership.json \
            --gate "ruff=make ruff" \
            --gate "test=make test" \
            --artifact .agent-artifacts/frozen-test-focus.json \
            --format json > /tmp/frozen-test-focus.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/frozen-test-focus.json").read_text())
          candidate = payload["candidates"][0]
          print("FROZEN_TEST_FOCUS_TARGET=" + candidate["target"])
          print("FROZEN_TEST_FOCUS_CONFIRMED_DIRECT=" + str(candidate["derived"]["confirmed_direct_test_count"]))
          print("FROZEN_TEST_FOCUS_REQUIRED_NEXT_EVIDENCE=" + json.dumps(payload["required_next_evidence"], sort_keys=True))
          if candidate["target"] != "hashmarks/codemap/task_action_projection.py":
              raise SystemExit("frozen test focus target mismatch")
          if candidate["derived"]["confirmed_direct_test_count"] != 4:
              raise SystemExit("frozen test ownership changed")
          if payload["required_next_evidence"]:
              raise SystemExit("frozen target has unresolved test evidence")
          PY
      - name: Execute frozen focused behavioral tests
        run: |
          uv run --frozen --no-sync --group test python -m pytest -q \
            tests/test_task_action_map.py \
            tests/test_task_action_brief.py \
            tests/test_task_action_session_reuse.py \
            tests/test_task_action_stale_workspace.py
          echo "POST_EDIT_FOCUSED_TESTS=PASS"
      - name: Run frozen repository Ruff gate
        run: |
          make ruff
          echo "POST_EDIT_GATE_RUFF=PASS"
      - name: Run frozen repository test gate
        run: |
          make test
          echo "POST_EDIT_GATE_TEST=PASS"
      - name: Bind BP2 post-edit behavior-preservation receipt
        run: |
          export PYTHONPATH="$PWD/.agent-economics/scripts"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from agent_economics.behavior_preservation import (
              behavior_preservation_readiness,
              behavior_preservation_receipt,
          )

          frozen_target = Path(os.environ["FROZEN_TARGET"])
          base_bytes = subprocess.check_output(
              ["git", "show", f"{os.environ['FROZEN_BASE_COMMIT']}:{frozen_target.as_posix()}"]
          )
          pre_source_identity = "sha256:" + hashlib.sha256(base_bytes).hexdigest()
          if pre_source_identity != os.environ["FROZEN_PRE_EDIT_SOURCE_IDENTITY"]:
              raise SystemExit("frozen pre-edit source identity mismatch")

          test_paths = [
              Path("tests/test_task_action_map.py"),
              Path("tests/test_task_action_brief.py"),
              Path("tests/test_task_action_session_reuse.py"),
              Path("tests/test_task_action_stale_workspace.py"),
          ]
          test_references = [
              {
                  "path": path.as_posix(),
                  "evidence_identity": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in test_paths
          ]
          boundary_names = [
              "canonical-ranking-and-role-projection",
              "owner-resolution-and-ambiguity-fail-closed",
              "decision-session-cache-isolation",
              "stale-workspace-authority-reconciliation",
              "task-action-brief-consumer-contract",
          ]
          review_semantic = {
              "target": frozen_target.as_posix(),
              "source_identity": pre_source_identity,
              "tests": test_references,
              "boundaries": boundary_names,
          }
          review_identity = "sha256:" + hashlib.sha256(
              json.dumps(review_semantic, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if review_identity != os.environ["FROZEN_PRE_EDIT_REVIEW_IDENTITY"]:
              raise SystemExit("frozen pre-edit review identity mismatch")

          boundaries = [
              {
                  "identity": name,
                  "classification": "direct",
                  "freshness": "fresh",
                  "provider_reference": {
                      "provider": "hashmarks-current-public-api-test-review",
                      "evidence_identity": review_identity,
                  },
              }
              for name in boundary_names
          ]
          pre_edit_evidence = behavior_preservation_readiness(
              target=frozen_target.as_posix(),
              source_identity=pre_source_identity,
              boundaries=boundaries,
              test_references=test_references,
              execution_receipt={
                  "source_identity": pre_source_identity,
                  "status": "PASS",
                  "test_evidence_identities": sorted(
                      row["evidence_identity"] for row in test_references
                  ),
                  "execution_identity": os.environ["FROZEN_PRE_EDIT_EXECUTION_IDENTITY"],
              },
              repository_gates=[
                  {"name": "ruff", "command": "make ruff"},
                  {"name": "test", "command": "make test"},
              ],
          )
          if pre_edit_evidence["status"] != "READY_FOR_BEHAVIOR_PRESERVING_EDIT":
              raise SystemExit("frozen pre-edit evidence no longer reconstructs as READY")
          if (
              pre_edit_evidence["evidence_identity"]
              != os.environ["FROZEN_PRE_EDIT_EVIDENCE_IDENTITY"]
          ):
              raise SystemExit("frozen pre-edit evidence identity mismatch")

          post_source_identity = "sha256:" + hashlib.sha256(
              frozen_target.read_bytes()
          ).hexdigest()
          execution_semantic = {
              "source_identity": post_source_identity,
              "test_evidence_identities": sorted(
                  row["evidence_identity"] for row in test_references
              ),
              "command": (
                  "uv run --frozen --no-sync --group test python -m pytest -q "
                  "tests/test_task_action_map.py tests/test_task_action_brief.py "
                  "tests/test_task_action_session_reuse.py tests/test_task_action_stale_workspace.py"
              ),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          post_execution_identity = "sha256:" + hashlib.sha256(
              json.dumps(execution_semantic, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()

          def gate_receipt(name: str, command: str) -> dict[str, str]:
              semantic = {
                  "name": name,
                  "command": command,
                  "post_edit_source_identity": post_source_identity,
                  "github_run_id": os.environ["GITHUB_RUN_ID"],
                  "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
              return {
                  "name": name,
                  "command": command,
                  "status": "PASS",
                  "execution_identity": "sha256:" + hashlib.sha256(
                      json.dumps(semantic, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest(),
              }

          receipt = behavior_preservation_receipt(
              pre_edit_evidence=pre_edit_evidence,
              post_edit_source_identity=post_source_identity,
              post_edit_test_references=test_references,
              post_edit_execution_receipt={
                  "source_identity": post_source_identity,
                  "status": "PASS",
                  "test_evidence_identities": sorted(
                      row["evidence_identity"] for row in test_references
                  ),
                  "execution_identity": post_execution_identity,
              },
              repository_gate_receipts=[
                  gate_receipt("ruff", "make ruff"),
                  gate_receipt("test", "make test"),
              ],
          )
          Path("/tmp/post-edit-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print("POST_EDIT_SOURCE_IDENTITY=" + post_source_identity)
          print("POST_EDIT_EXECUTION_IDENTITY=" + post_execution_identity)
          print("POST_EDIT_RECEIPT_STATUS=" + str(receipt["status"]))
          print("POST_EDIT_RECEIPT_IDENTITY=" + str(receipt["evidence_identity"]))
          print("POST_EDIT_UNRESOLVED=" + json.dumps(receipt["unresolved_evidence"], sort_keys=True))
          if receipt["status"] != "BEHAVIOR_PRESERVATION_VERIFIED":
              raise SystemExit("post-edit behavior preservation is not verified")
          PY

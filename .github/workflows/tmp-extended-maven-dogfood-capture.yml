name: Temporary extended Maven dogfood capture

on:
  push:
    branches:
      - dogfood/maven-minio-transitive-upgrade

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture extended native Maven evidence
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN="org.apache.maven.plugins:maven-dependency-plugin:3.9.0"

          capture_pair() {
            local dir="$1"
            local state="$2"
            local extra_args="${3:-}"
            (
              cd "${dir}/${state}"
              mvn -B -q ${extra_args} "${PLUGIN}:tree" \
                -DoutputType=json \
                -DoutputFile=tree.json \
                -Dstyle.color=never
              mvn -B -q ${extra_args} "${PLUGIN}:list" \
                -DoutputFile=list.txt \
                -Dstyle.color=never
            )
          }

          mkdir -p capture
          mvn --version > capture/maven-version.txt

          # 1. Mediation: same direct deps, same versions, declaration order changes
          # which same-depth transitive Spring version Maven selects.
          for state in before after; do
            mkdir -p "capture/mediation/${state}"
          done

          cat > capture/mediation/before/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>mediation-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.springframework</groupId>
                <artifactId>spring-web</artifactId>
                <version>6.1.13</version>
              </dependency>
              <dependency>
                <groupId>org.springframework</groupId>
                <artifactId>spring-context</artifactId>
                <version>6.2.0</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          cat > capture/mediation/after/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>mediation-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.springframework</groupId>
                <artifactId>spring-context</artifactId>
                <version>6.2.0</version>
              </dependency>
              <dependency>
                <groupId>org.springframework</groupId>
                <artifactId>spring-web</artifactId>
                <version>6.1.13</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          capture_pair capture/mediation before
          capture_pair capture/mediation after

          # 2. Exclusion: same direct dependency and version; an exclusion removes
          # a real transitive branch.
          for state in before after; do
            mkdir -p "capture/exclusion/${state}"
          done

          cat > capture/exclusion/before/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>exclusion-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>io.minio</groupId>
                <artifactId>minio</artifactId>
                <version>8.6.0</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          cat > capture/exclusion/after/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>exclusion-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>io.minio</groupId>
                <artifactId>minio</artifactId>
                <version>8.6.0</version>
                <exclusions>
                  <exclusion>
                    <groupId>com.google.guava</groupId>
                    <artifactId>guava</artifactId>
                  </exclusion>
                </exclusions>
              </dependency>
            </dependencies>
          </project>
          EOF

          capture_pair capture/exclusion before
          capture_pair capture/exclusion after

          # 3. BOM upgrade: application dependency declarations stay versionless;
          # one imported BOM version moves the resolved graph.
          for state in before after; do
            mkdir -p "capture/bom-upgrade/${state}"
          done

          cat > capture/bom-upgrade/before/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>bom-consumer</artifactId>
            <version>0.1.0</version>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-dependencies</artifactId>
                  <version>3.3.0</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>com.fasterxml.jackson.core</groupId>
                <artifactId>jackson-databind</artifactId>
              </dependency>
              <dependency>
                <groupId>io.netty</groupId>
                <artifactId>netty-handler</artifactId>
              </dependency>
              <dependency>
                <groupId>io.micrometer</groupId>
                <artifactId>micrometer-core</artifactId>
              </dependency>
              <dependency>
                <groupId>org.slf4j</groupId>
                <artifactId>slf4j-api</artifactId>
              </dependency>
              <dependency>
                <groupId>org.apache.tomcat.embed</groupId>
                <artifactId>tomcat-embed-core</artifactId>
              </dependency>
            </dependencies>
          </project>
          EOF

          sed 's/<version>3.3.0<\/version>/<version>3.4.0<\/version>/'             capture/bom-upgrade/before/pom.xml             > capture/bom-upgrade/after/pom.xml

          capture_pair capture/bom-upgrade before
          capture_pair capture/bom-upgrade after

          # 4. Multi-module reactor: one module's selected dependency changes and
          # the downstream module observes that new transitive selection.
          for state in before after; do
            root="capture/multi-module/${state}"
            mkdir -p "${root}/alpha" "${root}/beta" "${root}/captures/alpha" "${root}/captures/beta"
            cat > "${root}/pom.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>multi-parent</artifactId>
            <version>0.1.0</version>
            <packaging>pom</packaging>
            <modules>
              <module>alpha</module>
              <module>beta</module>
            </modules>
          </project>
          EOF
            cat > "${root}/beta/pom.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <parent>
              <groupId>hashmarks.dogfood</groupId>
              <artifactId>multi-parent</artifactId>
              <version>0.1.0</version>
              <relativePath>..</relativePath>
            </parent>
            <artifactId>multi-beta</artifactId>
            <dependencies>
              <dependency>
                <groupId>hashmarks.dogfood</groupId>
                <artifactId>multi-alpha</artifactId>
                <version>0.1.0</version>
              </dependency>
              <dependency>
                <groupId>com.squareup.okhttp3</groupId>
                <artifactId>okhttp</artifactId>
                <version>4.12.0</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          done

          cat > capture/multi-module/before/alpha/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <parent>
              <groupId>hashmarks.dogfood</groupId>
              <artifactId>multi-parent</artifactId>
              <version>0.1.0</version>
              <relativePath>..</relativePath>
            </parent>
            <artifactId>multi-alpha</artifactId>
            <dependencies>
              <dependency>
                <groupId>com.google.guava</groupId>
                <artifactId>guava</artifactId>
                <version>33.3.1-jre</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          sed 's/33.3.1-jre/33.4.8-jre/'             capture/multi-module/before/alpha/pom.xml             > capture/multi-module/after/alpha/pom.xml

          for state in before after; do
            root="capture/multi-module/${state}"
            repo="${PWD}/${root}/.m2"
            mvn -B -q -f "${root}/pom.xml" -Dmaven.repo.local="${repo}" -DskipTests install
            for module in alpha beta; do
              mvn -B -q -f "${root}/${module}/pom.xml" -Dmaven.repo.local="${repo}" "${PLUGIN}:tree" \
                -DoutputType=json \
                -DoutputFile="${PWD}/${root}/captures/${module}/tree.json" \
                -Dstyle.color=never
              mvn -B -q -f "${root}/${module}/pom.xml" -Dmaven.repo.local="${repo}" "${PLUGIN}:list" \
                -DoutputFile="${PWD}/${root}/captures/${module}/list.txt" \
                -Dstyle.color=never
            done
            rm -rf "${root}/.m2"
          done

          # 5. Profiles: same POM observed in two explicit contexts.
          mkdir -p capture/profiles/default capture/profiles/extra
          cat > capture/profiles/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>profile-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>commons-codec</groupId>
                <artifactId>commons-codec</artifactId>
                <version>1.17.1</version>
              </dependency>
            </dependencies>
            <profiles>
              <profile>
                <id>extra</id>
                <dependencies>
                  <dependency>
                    <groupId>org.apache.commons</groupId>
                    <artifactId>commons-compress</artifactId>
                    <version>1.27.1</version>
                  </dependency>
                </dependencies>
              </profile>
            </profiles>
          </project>
          EOF

          (
            cd capture/profiles
            mvn -B -q "${PLUGIN}:tree" -DoutputType=json               -DoutputFile=default/tree.json -Dstyle.color=never
            mvn -B -q "${PLUGIN}:list"               -DoutputFile=default/list.txt -Dstyle.color=never
            mvn -B -q -Pextra "${PLUGIN}:tree" -DoutputType=json               -DoutputFile=extra/tree.json -Dstyle.color=never
            mvn -B -q -Pextra "${PLUGIN}:list"               -DoutputFile=extra/list.txt -Dstyle.color=never
          )

          # Match existing fixture hygiene: preserve every Maven fact while
          # removing only Maven dependency:list's extra terminal blank line.
          find capture -name list.txt -type f -print0 | while IFS= read -r -d '' file; do
            perl -0pi -e 's/\n\n\z/\n/' "${file}"
          done

      - name: Commit extended Maven dogfood captures
        shell: bash
        run: |
          set -euo pipefail
          target="tests/fixtures/dependency_dogfood/maven"

          for scenario in mediation exclusion bom-upgrade multi-module profiles; do
            rm -rf "${target}/${scenario}"
            mkdir -p "${target}/${scenario}"
            cp -R "capture/${scenario}/." "${target}/${scenario}/"
            cp capture/maven-version.txt "${target}/${scenario}/maven-version.txt"
          done

          # Do not persist build-local Maven repositories if a failed cleanup
          # ever left one behind.
          find "${target}" -type d -name .m2 -prune -exec rm -rf {} +

          cat > "${target}/mediation/PROVENANCE.md" <<'EOF'
          # Maven mediation dogfood provenance

          Native Maven capture of two consumers with the same two direct dependency
          coordinates and versions. Only declaration order changes. Maven's
          nearest-definition / same-depth ordering mediation changes selected
          transitive versions. Library identities are corpus provenance only.
          EOF

          cat > "${target}/exclusion/PROVENANCE.md" <<'EOF'
          # Maven exclusion dogfood provenance

          Native Maven capture of the same direct dependency at the same version
          before and after one repository-declared transitive exclusion. The
          scenario attacks exact branch removal and qualified absence. Library
          identities are corpus provenance only.
          EOF

          cat > "${target}/bom-upgrade/PROVENANCE.md" <<'EOF'
          # Maven BOM-upgrade dogfood provenance

          Native Maven capture whose application dependencies remain versionless
          while one imported BOM moves from Spring Boot 3.3.0 to 3.4.0. The
          scenario attacks many resolved version/topology changes driven by one
          dependency-management authority. Spring identities are provenance only.
          EOF

          cat > "${target}/multi-module/PROVENANCE.md" <<'EOF'
          # Maven multi-module dogfood provenance

          Native Maven reactor capture with alpha and beta observed as separate
          Hashmarks contexts. Alpha changes one selected external dependency;
          beta depends on alpha and therefore observes the propagated transitive
          change. External library identities are corpus provenance only.
          EOF

          cat > "${target}/profiles/PROVENANCE.md" <<'EOF'
          # Maven profile-context dogfood provenance

          Native Maven capture of one unchanged POM in two explicit observations:
          default profile activation and -Pextra. Hashmarks treats those captures
          as distinct caller-named contexts and must never merge graph traversal
          or negative evidence across them. Package identities are provenance only.
          EOF

          git rm .github/workflows/tmp-extended-maven-dogfood-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "test: add adversarial Maven dogfood corpora"
          git push

name: Temporary Maven dogfood capture

on:
  push:
    branches:
      - dogfood/maven-minio-transitive-upgrade

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture native Maven evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          mvn --version | tee capture/maven-version.txt
          for spec in "before:8.5.17" "after:8.6.0"; do
            state="${spec%%:*}"
            version="${spec#*:}"
            dir="capture/${state}"
            mkdir -p "${dir}"
            cat > "${dir}/pom.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>hashmarks.dogfood</groupId>
            <artifactId>minio-consumer</artifactId>
            <version>0.1.0</version>
            <dependencies>
              <dependency>
                <groupId>io.minio</groupId>
                <artifactId>minio</artifactId>
                <version>${version}</version>
              </dependency>
            </dependencies>
          </project>
          EOF
            (
              cd "${dir}"
              mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.9.0:tree \
                -DoutputType=json \
                -DoutputFile=tree.json \
                -Dstyle.color=never
              mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.9.0:list \
                -DoutputFile=list.txt \
                -Dstyle.color=never
            )
          done
      - name: Commit captured fixture
        shell: bash
        run: |
          set -euo pipefail
          target="tests/fixtures/dependency_dogfood/maven/transitive-upgrade"
          mkdir -p "${target}/before" "${target}/after"
          cp capture/before/pom.xml capture/before/tree.json capture/before/list.txt "${target}/before/"
          cp capture/after/pom.xml capture/after/tree.json capture/after/list.txt "${target}/after/"
          cp capture/maven-version.txt "${target}/maven-version.txt"
          cat > "${target}/PROVENANCE.md" <<'EOF'
          # Transitive-upgrade Maven capture provenance

          This is a real native Maven consumer capture used as dependency dogfood.
          The consumer declares one direct dependency: `io.minio:minio`.

          - before: `8.5.17`
          - after: `8.6.0`
          - dependency plugin: `org.apache.maven.plugins:maven-dependency-plugin:3.9.0`
          - tree: `dependency:tree -DoutputType=json -DoutputFile=tree.json -Dstyle.color=never`
          - inventory: `dependency:list -DoutputFile=list.txt -Dstyle.color=never`

          MinIO and its dependency names are corpus provenance only. Hashmarks product
          semantics and assertions must remain producer-neutral and package-neutral.
          EOF
          git rm .github/workflows/tmp-maven-minio-dogfood-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "test: add real-world Maven transitive upgrade corpus"
          git push

name: Post-publish release smoke

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Published Linux/WSL install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install and exercise exact published Linux release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected release tag: $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          root="${RUNNER_TEMP}/hashmarks-post-publish"
          mkdir -p "$root/bin" "$root/workspace"
          curl -fsSL "$base/install.sh" -o "$root/install.sh"
          curl -fsSL "$base/SHA256SUMS.txt" -o "$root/SHA256SUMS.txt"
          (
            cd "$root"
            count="$(grep -Ec '^[0-9a-fA-F]{64}  install\.sh$' SHA256SUMS.txt)"
            test "$count" -eq 1
            grep -E '^[0-9a-fA-F]{64}  install\.sh$' SHA256SUMS.txt |
              sha256sum -c -
          )
          HASHMARKS_VERSION="$version" \
          HASHMARKS_INSTALL_DIR="$root/bin" \
            sh "$root/install.sh"
          test "$("$root/bin/hashmarks" --version)" = "hashmarks version $version"
          printf '%s\n' 'ANSWER = 42' > "$root/workspace/example.py"
          "$root/bin/hashmarks" --workspace "$root/workspace" map sync
          "$root/bin/hashmarks" --workspace "$root/workspace" map status

  windows:
    name: Published Windows install smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install and exercise exact published Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Unexpected release tag: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $root = Join-Path $env:RUNNER_TEMP "hashmarks-post-publish"
          $bin = Join-Path $root "bin"
          $workspace = Join-Path $root "workspace"
          New-Item -ItemType Directory -Force -Path $bin, $workspace | Out-Null
          $installer = Join-Path $root "install.ps1"
          $sums = Join-Path $root "SHA256SUMS.txt"
          Invoke-WebRequest -Uri "$base/install.ps1" -OutFile $installer
          Invoke-WebRequest -Uri "$base/SHA256SUMS.txt" -OutFile $sums
          $sumMatches = @(
            Select-String -LiteralPath $sums -Pattern '^([0-9a-fA-F]{64})  install\.ps1$'
          )
          if ($sumMatches.Count -ne 1) {
            throw "Published SHA256SUMS.txt does not bind install.ps1 exactly once"
          }
          $expected = $sumMatches[0].Matches[0].Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Published install.ps1 checksum mismatch"
          }
          $env:HASHMARKS_VERSION = $version
          $env:HASHMARKS_INSTALL_DIR = $bin
          $env:HASHMARKS_SKIP_PATH_UPDATE = "1"
          & $installer
          $target = Join-Path $bin "hashmarks.exe"
          $reported = (& $target --version).Trim()
          if ($reported -ne "hashmarks version $version") {
            throw "Published Windows version mismatch: $reported"
          }
          Set-Content -LiteralPath (Join-Path $workspace "example.py") -Value "ANSWER = 42" -Encoding ascii
          & $target --workspace $workspace map sync
          if ($LASTEXITCODE -ne 0) {
            throw "Published Windows map sync failed"
          }
          & $target --workspace $workspace map status
          if ($LASTEXITCODE -ne 0) {
            throw "Published Windows map status failed"
          }
      - name: Checkout exact published source for interactive upgrade smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Materialize locked Windows terminal smoke dependency
        run: uv sync --frozen --only-group release-smoke --python 3.14
      - name: Exercise prior installed CLI upgrading to exact published Windows bytes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          & .venv\Scripts\python.exe scripts\windows_published_upgrade_smoke.py `
            --tag $env:RELEASE_TAG `
            --repository $env:GITHUB_REPOSITORY `
            --root (Join-Path $env:RUNNER_TEMP "hashmarks-post-publish")

name: Behavior-preserving Agent Economics dogfood

on:
  push:
    branches:
      - dogfood-behavior-preserving-split

permissions:
  contents: read

jobs:
  measure:
    name: Fresh current-main debt measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv python install 3.11
      - name: Materialize exact qualified Agent Economics
        env:
          AE_REVISION: acf435e124d963bb56033b9d5f5f83cb93630916
        run: |
          git clone --filter=blob:none https://github.com/Hugloss/agentsCookbook.git .agent-economics
          git -C .agent-economics checkout --detach "$AE_REVISION"
          test "$(git -C .agent-economics rev-parse HEAD)" = "$AE_REVISION"
      - name: Install Hashmarks-owned Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11
      - name: Measure exact parity and ranked hotspots
        env:
          PYTHONPATH: ${{ github.workspace }}/.agent-economics/scripts
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          uv run --no-sync python scripts/agent_evaluation/ruff_debt_agent_economics_parity.py
      - name: Run pre-edit task-action behavioral suite
        run: |
          uv sync --group test --python 3.11
          uv run pytest -q \
            tests/test_task_action_map.py \
            tests/test_task_action_brief.py \
            tests/test_task_action_session_reuse.py \
            tests/test_task_action_stale_workspace.py
      - name: Resolve test-focus evidence for first production candidate
        env:
          PYTHONPATH: ${{ github.workspace }}/.agent-economics/scripts
        run: |
          uv run --no-sync python -m agent_economics.test_focus_cli \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --ownership-hints-path scripts/agent_evaluation/task_action_projection_test_ownership.json \
            --changed-path hashmarks/codemap/task_action_projection.py \
            --gate 'ruff=make ruff' \
            --gate 'tests=make test' \
            --artifact .agent-artifacts/task-action-projection-test-focus.json \
            --format json
          cat .agent-artifacts/task-action-projection-test-focus.json
      - name: Bind BP1 pre-edit behavior-preservation evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/.agent-economics/scripts
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from agent_economics.behavior_preservation import behavior_preservation_readiness

          target = Path("hashmarks/codemap/task_action_projection.py")
          tests = [
              Path("tests/test_task_action_map.py"),
              Path("tests/test_task_action_brief.py"),
              Path("tests/test_task_action_session_reuse.py"),
              Path("tests/test_task_action_stale_workspace.py"),
          ]
          digest = lambda path: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          source_identity = digest(target)
          test_references = [
              {"path": path.as_posix(), "evidence_identity": digest(path)}
              for path in tests
          ]
          provider = {
              "provider": "hashmarks",
              "evidence_identity": "sha256:" + hashlib.sha256(
                  Path("scripts/agent_evaluation/task_action_projection_test_ownership.json").read_bytes()
              ).hexdigest(),
          }
          boundaries = [
              {"identity": "task-action-projection-and-ambiguity", "classification": "direct", "freshness": "fresh", "provider_reference": provider},
              {"identity": "task-action-public-brief", "classification": "direct", "freshness": "fresh", "provider_reference": provider},
              {"identity": "task-action-session-cache-and-mutation-isolation", "classification": "direct", "freshness": "fresh", "provider_reference": provider},
              {"identity": "task-action-stale-workspace-reconciliation", "classification": "direct", "freshness": "fresh", "provider_reference": provider},
          ]
          receipt_semantic = {
              "source_identity": source_identity,
              "status": "PASS",
              "test_evidence_identities": sorted(row["evidence_identity"] for row in test_references),
          }
          receipt = {
              **receipt_semantic,
              "execution_identity": "sha256:" + hashlib.sha256(
                  json.dumps(receipt_semantic, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest(),
          }
          result = behavior_preservation_readiness(
              target=target.as_posix(),
              source_identity=source_identity,
              boundaries=boundaries,
              test_references=test_references,
              execution_receipt=receipt,
              repository_gates=[
                  {"name": "ruff", "command": "make ruff"},
                  {"name": "tests", "command": "make test"},
              ],
          )
          artifact = Path(".agent-artifacts/task-action-projection-behavior-preservation.json")
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(artifact.read_text())
          if result["status"] != "READY_FOR_BEHAVIOR_PRESERVING_EDIT":
              raise SystemExit(f"BP1 not ready: {result['status']}")
          if result["authority"]["edit_authorized"] or result["authority"]["refactor_safety_proven"]:
              raise SystemExit("BP1 authority boundary violated")
          PY

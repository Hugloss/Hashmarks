name: Windows installer qualification

on:
  pull_request:
    paths:
      - .github/workflows/windows-installer.yml
      - install.ps1
      - scripts/windows_installer_smoke.ps1
      - scripts/standalone_build.py
      - scripts/hashmarks_entrypoint.py
      - pyproject.toml
      - uv.lock

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Native Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Build through the canonical standalone owner
        shell: pwsh
        run: uv run --frozen --no-sync python scripts\standalone_build.py
      - name: Prove native install and upgrade behavior
        shell: pwsh
        run: |
          $version = (& .venv\Scripts\python.exe -c "import hashmarks; print(hashmarks.__version__)").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot determine the candidate Hashmarks version"
          }
          & scripts\windows_installer_smoke.ps1 `
            -Hashmarks "$PWD\dist\hashmarks.exe" `
            -Version $version

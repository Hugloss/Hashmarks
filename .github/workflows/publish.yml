name: Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.toml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact reviewed source SHA; otherwise use release-request.toml
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate reviewed release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      publication_attempt: ${{ steps.request.outputs.publication_attempt }}
    steps:
      - name: Checkout reviewed release request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: request
        name: Resolve reviewed release request
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("release publication is authorized only from main")

          request = tomllib.loads(
              pathlib.Path(".github/release-request.toml").read_text(encoding="utf-8")
          )
          unknown = set(request) - {"version", "source_sha", "publication_attempt"}
          if unknown:
              raise SystemExit(f"unsupported release-request fields: {sorted(unknown)!r}")

          publication_attempt = request.get("publication_attempt", 1)
          if (
              isinstance(publication_attempt, bool)
              or not isinstance(publication_attempt, int)
              or publication_attempt < 1
          ):
              raise SystemExit("publication_attempt must be a positive integer")

          version = str(request["version"])
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"invalid release version: {version!r}")

          dispatch_source = os.environ.get("DISPATCH_SOURCE_SHA", "").strip()
          request_source = str(request.get("source_sha", "")).strip()
          trigger_source = os.environ["TRIGGER_SOURCE_SHA"].strip()
          source_sha = dispatch_source or request_source or trigger_source
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit(
                  "source_sha must be an exact lowercase 40-character commit SHA"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"requested_version={version}\n")
              output.write(f"source_sha={source_sha}\n")
              output.write(f"publication_attempt={publication_attempt}\n")
          PY
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source is reachable from current main
        env:
          RELEASE_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" origin/main; then
            echo "::error::Release source $RELEASE_SOURCE_SHA is not reachable from main"
            exit 1
          fi
      - id: release
        name: Bind request to source package version and finalized changelog
        env:
          RELEASE_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUESTED_VERSION: ${{ steps.request.outputs.requested_version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          root = pathlib.Path(".")
          source_sha = os.environ["RELEASE_SOURCE_SHA"]
          observed_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if observed_sha != source_sha:
              raise SystemExit(
                  f"release source mismatch: requested={source_sha!r} observed={observed_sha!r}"
              )

          project = tomllib.loads(
              (root / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          version = str(project["version"])
          requested = os.environ["REQUESTED_VERSION"]
          if requested != version:
              raise SystemExit(
                  f"release request/version mismatch: request={requested!r} project={version!r}"
              )

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## {version} — "
          if heading not in changelog:
              raise SystemExit(f"CHANGELOG.md has no finalized {version} heading")
          section = changelog.split(heading, 1)[1].split("\n## ", 1)[0]
          if "Development" in section.splitlines()[0]:
              raise SystemExit(f"CHANGELOG.md still marks {version} as Development")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"source_sha={source_sha}\n")
          PY

  build:
    name: Build and qualify exact release artifacts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Check committed dependency convergence
        run: uv lock --check
      - run: uv sync --frozen --group test --extra mcp --python 3.14
      - name: Validate release tag against package version
        run: uv run --frozen --no-sync python scripts/release_contract.py validate-tag --tag "${{ needs.prepare.outputs.tag }}"
      - name: Materialize locked lint toolchain
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --frozen --only-group lint --python 3.14
      - name: Enforce configured Ruff and zero complexity debt
        run: make lint
      - name: Run native release tests
        run: make test
      - name: Run MCP concurrency stress
        run: make mcp-concurrency-stress
      - name: Build exact release artifacts once
        run: |
          rm -rf dist release .release-wheel .release-sdist
          uv build --out-dir dist
          mkdir -p release/packages
          cp dist/*.whl dist/*.tar.gz release/packages/
      - name: Smoke exact wheel
        run: |
          wheel=$(find release/packages -maxdepth 1 -type f -name '*.whl' -print -quit)
          uv venv --python 3.14 .release-wheel
          uv pip install --offline --python .release-wheel/bin/python "$wheel"
          .release-wheel/bin/python -I scripts/installed_artifact_smoke.py
      - name: Smoke exact sdist
        run: |
          sdist=$(find release/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          uv venv --python 3.14 .release-sdist
          uv pip install --offline --python .release-sdist/bin/python "$sdist"
          .release-sdist/bin/python -I scripts/installed_artifact_smoke.py
      - name: Bind exact package qualification bytes
        run: |
          uv run --frozen --no-sync python scripts/release_contract.py manifest \
            --dist release/packages \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --output release/package-manifest.json \
            --sha256sums release/PACKAGE_SHA256SUMS.txt
      - name: Upload exact qualified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-python-release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14

  standalone-linux:
    name: Build verified standalone Linux/WSL CLI/MCP
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Add pinned standalone packager
        run: uv pip install --python .venv/bin/python "pyinstaller==6.22.3"
      - name: Build self-contained executable
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name hashmarks \
            --collect-all hashmarks \
            scripts/hashmarks_entrypoint.py
      - name: Smoke standalone CLI and MCP
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(./dist/hashmarks --version)" = "hashmarks version $RELEASE_VERSION"
          ./dist/hashmarks version
          .venv/bin/python -I scripts/mcp_installed_artifact_smoke.py \
            --hashmarks "$PWD/dist/hashmarks"
      - name: Install exact standalone through Linux/WSL installer
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bundle="$PWD/.standalone-install-source"
          target="$PWD/.standalone-install-target"
          mkdir -p "$bundle" "$target"
          cp dist/hashmarks "$bundle/hashmarks-linux-x86_64"
          (
            cd "$bundle"
            sha256sum hashmarks-linux-x86_64 > hashmarks-linux-x86_64.sha256
          )
          HASHMARKS_DOWNLOAD_BASE_URL="file://$bundle" \
          HASHMARKS_INSTALL_DIR="$target" \
          HASHMARKS_VERSION="$RELEASE_VERSION" \
            sh install.sh
          test "$("$target/hashmarks" --version)" = "hashmarks version $RELEASE_VERSION"
      - name: Bind native Linux/WSL standalone qualification
        run: |
          mkdir -p release/standalone/linux
          cp dist/hashmarks release/standalone/linux/hashmarks-linux-x86_64
          chmod 0755 release/standalone/linux/hashmarks-linux-x86_64
          (
            cd release/standalone/linux
            sha256sum hashmarks-linux-x86_64 > hashmarks-linux-x86_64.sha256
          )
          .venv/bin/python scripts/release_contract.py standalone-qualification \
            --artifact release/standalone/linux/hashmarks-linux-x86_64 \
            --checksum release/standalone/linux/hashmarks-linux-x86_64.sha256 \
            --platform linux \
            --architecture x86_64 \
            --output release/standalone/linux/standalone-qualification.json
          .venv/bin/python scripts/release_contract.py verify-standalone-qualification \
            --bundle release/standalone/linux
      - name: Upload Linux/WSL qualified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-standalone-linux-release-bundle
          path: release/standalone/linux/
          if-no-files-found: error
          retention-days: 14

  standalone-windows:
    name: Build verified standalone Windows CLI/MCP
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Add pinned standalone packager
        shell: pwsh
        run: uv pip install --python .venv\Scripts\python.exe "pyinstaller==6.22.3"
      - name: Build self-contained executable
        shell: pwsh
        run: |
          & .venv\Scripts\pyinstaller.exe `
            --clean `
            --noconfirm `
            --onefile `
            --name hashmarks `
            --collect-all hashmarks `
            scripts/hashmarks_entrypoint.py
      - name: Smoke standalone CLI, MCP, install, and upgrade
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $reported = (& .\dist\hashmarks.exe --version).Trim()
          if ($reported -ne "hashmarks version $env:RELEASE_VERSION") {
            throw "Windows standalone version mismatch: $reported"
          }
          & .venv\Scripts\python.exe -I scripts\mcp_installed_artifact_smoke.py `
            --hashmarks "$PWD\dist\hashmarks.exe"
          & scripts\windows_installer_smoke.ps1 `
            -Hashmarks "$PWD\dist\hashmarks.exe" `
            -Version $env:RELEASE_VERSION
      - name: Bind native Windows standalone qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\standalone\windows | Out-Null
          $asset = "release\standalone\windows\hashmarks-windows-x86_64.exe"
          Copy-Item dist\hashmarks.exe $asset
          $checksum = "$asset.sha256"
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$digest  hashmarks-windows-x86_64.exe" -Encoding ascii
          & .venv\Scripts\python.exe scripts\release_contract.py standalone-qualification `
            --artifact $asset `
            --checksum $checksum `
            --platform windows `
            --architecture x86_64 `
            --output release\standalone\windows\standalone-qualification.json
          & .venv\Scripts\python.exe scripts\release_contract.py verify-standalone-qualification `
            --bundle release\standalone\windows
      - name: Upload Windows qualified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-standalone-windows-release-bundle
          path: release/standalone/windows/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact qualified bytes to GitHub Release
    needs: [prepare, build, standalone-linux, standalone-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact qualified Python release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-python-release-bundle
          path: release/
      - name: Download exact qualified Linux/WSL standalone bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-standalone-linux-release-bundle
          path: release/standalone/linux/
      - name: Download exact qualified Windows standalone bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-standalone-windows-release-bundle
          path: release/standalone/windows/
      - name: Verify downloaded release bytes and bind publication identity
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 workflow/scripts/release_contract.py verify \
            --root source \
            --dist release/packages \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --manifest release/package-manifest.json
          (cd release/packages && sha256sum -c ../PACKAGE_SHA256SUMS.txt)
          chmod 0755 release/standalone/linux/hashmarks-linux-x86_64
          python3 workflow/scripts/release_contract.py verify-standalone-qualification \
            --root source \
            --bundle release/standalone/linux
          python3 workflow/scripts/release_contract.py verify-standalone-qualification \
            --root source \
            --bundle release/standalone/windows
          test "$(release/standalone/linux/hashmarks-linux-x86_64 --version)" = \
            "hashmarks version $RELEASE_VERSION"
          python3 workflow/scripts/release_contract.py publication-manifest \
            --root source \
            --dist release/packages \
            --standalone-bundle release/standalone/linux \
            --standalone-bundle release/standalone/windows \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --output release/release-manifest.json \
            --sha256sums release/SHA256SUMS.txt
          python3 workflow/scripts/release_contract.py verify-publication \
            --root source \
            --dist release/packages \
            --standalone-bundle release/standalone/linux \
            --standalone-bundle release/standalone/windows \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --manifest release/release-manifest.json
      - name: Materialize reviewed changelog section as release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("source/CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} — "
          start = changelog.index(marker)
          remainder = changelog[start:]
          boundary = remainder.find("\n## ", len(marker))
          section = remainder if boundary < 0 else remainder[:boundary]
          pathlib.Path("release/release-notes.md").write_text(
              section.rstrip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify any existing release tag resolves to this exact merge SHA
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git -C source ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git -C source fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit=$(git -C source rev-list -n 1 "$RELEASE_TAG")
            if [ "$tag_commit" != "${{ needs.prepare.outputs.source_sha }}" ]; then
              echo "::error::Existing tag $RELEASE_TAG resolves to $tag_commit, not ${{ needs.prepare.outputs.source_sha }}"
              exit 1
            fi
          fi
      - name: Prepare exact reviewed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')
            if [ "$draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            if [ "$target" != "${{ needs.prepare.outputs.source_sha }}" ]; then
              echo "::error::Existing draft $RELEASE_TAG targets $target, not ${{ needs.prepare.outputs.source_sha }}"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --target "${{ needs.prepare.outputs.source_sha }}" \
              --title "Hashmarks $RELEASE_VERSION" \
              --notes-file release/release-notes.md \
              --draft
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ needs.prepare.outputs.source_sha }}" \
              --title "Hashmarks $RELEASE_VERSION" \
              --notes-file release/release-notes.md \
              --draft
          fi
      - name: Remove stale assets from reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            if [ -n "$asset" ]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done
      - name: Upload qualified assets to reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/packages/* \
            release/release-manifest.json \
            release/SHA256SUMS.txt \
            release/standalone/linux/hashmarks-linux-x86_64 \
            release/standalone/linux/hashmarks-linux-x86_64.sha256 \
            release/standalone/windows/hashmarks-windows-x86_64.exe \
            release/standalone/windows/hashmarks-windows-x86_64.exe.sha256 \
            --clobber
      - name: Verify exact reviewed draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release/expected-assets.txt <<EOF
          SHA256SUMS.txt
          hashmarks-$RELEASE_VERSION-py3-none-any.whl
          hashmarks-$RELEASE_VERSION.tar.gz
          hashmarks-linux-x86_64
          hashmarks-linux-x86_64.sha256
          hashmarks-windows-x86_64.exe
          hashmarks-windows-x86_64.exe.sha256
          release-manifest.json
          EOF
          sort -o release/expected-assets.txt release/expected-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            sort > release/actual-assets.txt
          if ! diff -u release/expected-assets.txt release/actual-assets.txt; then
            echo "::error::Draft release asset set does not exactly match qualified publication assets"
            exit 1
          fi
      - name: Publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

name: Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Validate reviewed release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: release
        name: Bind request to package version and finalized changelog
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("release publication is authorized only from main")

          root = pathlib.Path(".")
          request = tomllib.loads(
              (root / ".github" / "release-request.toml").read_text(encoding="utf-8")
          )
          project = tomllib.loads(
              (root / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          version = str(project["version"])
          requested = str(request["version"])
          if requested != version:
              raise SystemExit(
                  f"release request/version mismatch: request={requested!r} project={version!r}"
              )

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## {version} — "
          if heading not in changelog:
              raise SystemExit(f"CHANGELOG.md has no finalized {version} heading")
          section = changelog.split(heading, 1)[1].split("\n## ", 1)[0]
          if "Development" in section.splitlines()[0]:
              raise SystemExit(f"CHANGELOG.md still marks {version} as Development")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

  build:
    name: Build and qualify exact release artifacts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Check committed dependency convergence
        run: uv lock --check
      - run: uv sync --frozen --group test --extra mcp --python 3.14
      - name: Validate release tag against package version
        run: uv run --frozen --no-sync python scripts/release_contract.py validate-tag --tag "${{ needs.prepare.outputs.tag }}"
      - name: Enforce configured Ruff and zero complexity debt
        run: make lint
      - name: Run native release tests
        run: make test
      - name: Run MCP concurrency stress
        run: make mcp-concurrency-stress
      - name: Build exact release artifacts once
        run: |
          rm -rf dist release .release-wheel .release-sdist
          uv build --out-dir dist
          mkdir -p release/packages
          cp dist/*.whl dist/*.tar.gz release/packages/
      - name: Smoke exact wheel
        run: |
          wheel=$(find release/packages -maxdepth 1 -type f -name '*.whl' -print -quit)
          uv venv --python 3.14 .release-wheel
          uv pip install --offline --python .release-wheel/bin/python "$wheel"
          .release-wheel/bin/python -I scripts/installed_artifact_smoke.py
      - name: Smoke exact sdist
        run: |
          sdist=$(find release/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          uv venv --python 3.14 .release-sdist
          uv pip install --offline --python .release-sdist/bin/python "$sdist"
          .release-sdist/bin/python -I scripts/installed_artifact_smoke.py
      - name: Bind exact release bytes
        run: |
          uv run --frozen --no-sync python scripts/release_contract.py manifest \
            --dist release/packages \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --output release/release-manifest.json \
            --sha256sums release/SHA256SUMS.txt
      - name: Upload exact qualified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-python-release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14

  standalone:
    name: Build verified standalone Linux CLI/MCP
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Add pinned standalone packager
        run: uv pip install --python .venv/bin/python "pyinstaller==6.22.3"
      - name: Build self-contained executable
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name hashmarks \
            --collect-all hashmarks \
            scripts/hashmarks_entrypoint.py
      - name: Smoke standalone CLI and MCP
        run: |
          ./dist/hashmarks --version
          ./dist/hashmarks version
          .venv/bin/python -I scripts/mcp_installed_artifact_smoke.py \
            --hashmarks "$PWD/dist/hashmarks"
      - name: Bind standalone release bytes
        run: |
          mkdir -p release/standalone
          cp dist/hashmarks release/standalone/hashmarks-linux-x86_64
          chmod 0755 release/standalone/hashmarks-linux-x86_64
          (
            cd release/standalone
            sha256sum hashmarks-linux-x86_64 > hashmarks-linux-x86_64.sha256
          )
      - name: Upload standalone qualified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-standalone-release-bundle
          path: release/standalone/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact qualified bytes to GitHub Release
    needs: [prepare, build, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact qualified Python release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-python-release-bundle
          path: release/
      - name: Download exact qualified standalone release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-standalone-release-bundle
          path: release/standalone/
      - name: Verify downloaded release bytes
        run: |
          python3 scripts/release_contract.py verify \
            --dist release/packages \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --manifest release/release-manifest.json
          (cd release/packages && sha256sum -c ../SHA256SUMS.txt)
          chmod 0755 release/standalone/hashmarks-linux-x86_64
          (
            cd release/standalone
            sha256sum -c hashmarks-linux-x86_64.sha256
          )
          release/standalone/hashmarks-linux-x86_64 --version
      - name: Create reviewed draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')
            if [ "$draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            if [ "$target" != "${{ github.sha }}" ]; then
              echo "::error::Existing draft $RELEASE_TAG targets $target, not ${{ github.sha }}"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "Hashmarks $RELEASE_VERSION" \
              --generate-notes \
              --draft
          fi
      - name: Upload qualified assets to reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/packages/* \
            release/release-manifest.json \
            release/SHA256SUMS.txt \
            release/standalone/hashmarks-linux-x86_64 \
            release/standalone/hashmarks-linux-x86_64.sha256 \
            --clobber
      - name: Publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

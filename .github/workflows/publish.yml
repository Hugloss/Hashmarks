name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and qualify exact release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --group test --extra mcp --python 3.14
      - name: Validate release tag against package version
        run: uv run --no-sync python scripts/release_contract.py validate-tag --tag "${{ github.event.release.tag_name }}"
      - name: Run native release tests
        run: make test
      - name: Run exact Ruff minimum contract
        run: |
          uv venv --python 3.14 .ruff-venv
          uv pip install --python .ruff-venv/bin/python ruff==0.12.0
          PATH="$PWD/.ruff-venv/bin:$PATH" make lint
      - name: Run MCP concurrency stress
        run: make mcp-concurrency-stress
      - name: Build exact release artifacts once
        run: |
          rm -rf dist release .release-wheel .release-sdist
          uv build --out-dir dist
          mkdir -p release/packages
          cp dist/*.whl dist/*.tar.gz release/packages/
      - name: Smoke exact wheel
        run: |
          wheel=$(find release/packages -maxdepth 1 -type f -name '*.whl' -print -quit)
          uv venv --python 3.14 .release-wheel
          uv pip install --offline --python .release-wheel/bin/python "$wheel"
          .release-wheel/bin/python -I scripts/installed_artifact_smoke.py
      - name: Smoke exact sdist
        run: |
          sdist=$(find release/packages -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          uv venv --python 3.14 .release-sdist
          uv pip install --offline --python .release-sdist/bin/python "$sdist"
          .release-sdist/bin/python -I scripts/installed_artifact_smoke.py
      - name: Bind exact release bytes
        run: |
          uv run --no-sync python scripts/release_contract.py manifest \
            --dist release/packages \
            --tag "${{ github.event.release.tag_name }}" \
            --output release/release-manifest.json \
            --sha256sums release/SHA256SUMS.txt
      - name: Upload exact qualified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact qualified bytes to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download exact qualified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release-bundle
          path: release/
      - name: Verify downloaded release bytes
        run: |
          python3 scripts/release_contract.py verify \
            --dist release/packages \
            --tag "${{ github.event.release.tag_name }}" \
            --manifest release/release-manifest.json
          (cd release/packages && sha256sum -c ../SHA256SUMS.txt)
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/
          attestations: true
          print-hash: true

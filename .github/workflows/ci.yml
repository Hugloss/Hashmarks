name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    name: Python formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Materialize locked Ruff environment
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --frozen --only-group lint --python 3.11
      - name: Ruff format — show exact repair diff
        shell: bash
        run: |
          if ! .ruff-venv/bin/ruff format --check --diff .; then
            echo "::error title=Ruff formatting required::Canonical Python formatting differs. Apply the diff above, or run: make agent-finish"
            echo ""
            echo "REPAIR: make agent-finish"
            exit 1
          fi
      - name: Git whitespace in candidate diff
        run: git diff --check HEAD^1 HEAD --
  ruff-debt:
    name: Current Ruff and size gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Materialize locked Ruff environment
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --frozen --only-group lint --python 3.11
      - name: Enforce configured Ruff and zero complexity debt
        run: make lint
      - name: Exact current Ruff debt inventory
        if: always()
        continue-on-error: true
        run: make lint-debt-json

  fast-gate:
    name: Fast validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Check committed dependency convergence
        run: uv lock --check
      - run: uv sync --frozen --group test --python 3.11
      - run: make compile
  authority-diagnostics:
    name: Workspace authority diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --group test --python 3.11
      - name: Prove workspace-state authority
        run: uv run --frozen --no-sync python -m pytest -q tests/test_codemap_state_binding.py

  evidence-binding-diagnostics:
    name: Repository evidence binding diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --group test --python 3.11
      - name: Prove repository evidence binding behavior
        run: >-
          uv run --frozen --no-sync python -m pytest -q
          tests/test_repository_evidence_bindings.py
          tests/test_semantic_ownership_architecture.py

  consumer-wheel-artifact:
    name: Consumer wheel artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build wheel from the checked-out commit
        run: uv build --wheel --out-dir dist
      - name: Record immutable source and artifact identities
        run: |
          git rev-parse HEAD > dist/HASHMARKS_GIT_COMMIT
          git rev-parse HEAD^{tree} > dist/HASHMARKS_GIT_TREE
          sha256sum dist/*.whl > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashmarks-wheel-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release-environment:
    name: Release qualification environment (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group test --extra mcp --python 3.14
      - run: make test-profile
      - name: Smoke artifacts without changing existing dist
        run: |
          mkdir -p dist
          printf '%s\n' 'artifact-check must preserve this' > dist/artifact-check-preservation-sentinel
          make artifact-check ARTIFACT_PYTHON=3.14
          test "$(cat dist/artifact-check-preservation-sentinel)" = 'artifact-check must preserve this'
      - name: Build publication rehearsal package bundle
        run: |
          rm -rf publication-rehearsal
          mkdir -p publication-rehearsal/build publication-rehearsal/packages
          uv build --out-dir publication-rehearsal/build
          cp publication-rehearsal/build/*.whl publication-rehearsal/packages/
          cp publication-rehearsal/build/*.tar.gz publication-rehearsal/packages/
          version="$(uv run --frozen --no-sync python -c 'import hashmarks; print(hashmarks.__version__)')"
          uv run --frozen --no-sync python scripts/release_contract.py manifest \
            --dist publication-rehearsal/packages \
            --tag "v$version" \
            --output publication-rehearsal/package-manifest.json \
            --sha256sums publication-rehearsal/PACKAGE_SHA256SUMS.txt
          rm -rf publication-rehearsal/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashmarks-qualified-python-${{ github.sha }}
          path: publication-rehearsal/
          if-no-files-found: error

  python-support:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Pull requests exercise the minimum and newest supported interpreters.
      # Pushes to main retain the complete declared compatibility qualification.
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11","3.14"]' || '["3.11","3.12","3.13","3.14"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --group test --python ${{ matrix.python }}
      - run: make test
      - run: make artifact-check ARTIFACT_PYTHON=${{ matrix.python }}

  mcp-interop:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp>=2.2.0"
            label: "MCP latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python }} .mcp-venv
      - name: Install exact wheel and MCP compatibility line
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --python .mcp-venv/bin/python "$wheel" "${{ matrix.mcp }}"
      - name: Smoke installed wheel through official MCP SDK
        run: .mcp-venv/bin/python -I scripts/mcp_installed_artifact_smoke.py --hashmarks "$PWD/.mcp-venv/bin/hashmarks"

  standalone-artifact:
    name: Standalone Linux/WSL CLI/MCP artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Add pinned standalone packager
        run: uv pip install --python .venv/bin/python "pyinstaller==6.22.3"
      - name: Build and smoke self-contained executable
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name hashmarks \
            --collect-all hashmarks \
            scripts/hashmarks_entrypoint.py
          version="$(uv run --frozen --no-sync python -c 'import hashmarks; print(hashmarks.__version__)')"
          test "$(./dist/hashmarks --version)" = "hashmarks version $version"
          ./dist/hashmarks version
          .venv/bin/python -I scripts/mcp_installed_artifact_smoke.py \
            --hashmarks "$PWD/dist/hashmarks"
      - name: Install exact standalone through Linux/WSL installer
        run: |
          version="$(uv run --frozen --no-sync python -c 'import hashmarks; print(hashmarks.__version__)')"
          bundle="$PWD/.standalone-install-source"
          target="$PWD/.standalone-install-target"
          mkdir -p "$bundle" "$target"
          cp dist/hashmarks "$bundle/hashmarks-linux-x86_64"
          (
            cd "$bundle"
            sha256sum hashmarks-linux-x86_64 > hashmarks-linux-x86_64.sha256
          )
          HASHMARKS_DOWNLOAD_BASE_URL="file://$bundle" \
          HASHMARKS_INSTALL_DIR="$target" \
          HASHMARKS_VERSION="$version" \
            sh install.sh
          test "$("$target/hashmarks" --version)" = "hashmarks version $version"
      - name: Bind native Linux/WSL standalone qualification
        run: |
          mkdir -p dist/qualified-linux
          cp dist/hashmarks dist/qualified-linux/hashmarks-linux-x86_64
          chmod 0755 dist/qualified-linux/hashmarks-linux-x86_64
          (
            cd dist/qualified-linux
            sha256sum hashmarks-linux-x86_64 > hashmarks-linux-x86_64.sha256
          )
          uv run --frozen --no-sync python scripts/release_contract.py standalone-qualification \
            --artifact dist/qualified-linux/hashmarks-linux-x86_64 \
            --checksum dist/qualified-linux/hashmarks-linux-x86_64.sha256 \
            --platform linux \
            --architecture x86_64 \
            --output dist/qualified-linux/standalone-qualification.json
          uv run --frozen --no-sync python scripts/release_contract.py verify-standalone-qualification \
            --bundle dist/qualified-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashmarks-standalone-linux-${{ github.sha }}
          path: dist/qualified-linux/
          if-no-files-found: error

  standalone-windows-artifact:
    name: Standalone Windows CLI/MCP artifact
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: Materialize locked Hashmarks + MCP runtime
        run: uv sync --frozen --extra mcp --python 3.14
      - name: Add pinned standalone packager
        shell: pwsh
        run: uv pip install --python .venv\Scripts\python.exe "pyinstaller==6.22.3"
      - name: Build and smoke native Windows executable
        shell: pwsh
        run: |
          & .venv\Scripts\pyinstaller.exe `
            --clean `
            --noconfirm `
            --onefile `
            --name hashmarks `
            --collect-all hashmarks `
            scripts/hashmarks_entrypoint.py
          $version = (& .venv\Scripts\python.exe -c "import hashmarks; print(hashmarks.__version__)").Trim()
          $reported = (& .\dist\hashmarks.exe --version).Trim()
          if ($reported -ne "hashmarks version $version") {
            throw "Windows standalone version mismatch: $reported"
          }
          & .venv\Scripts\python.exe -I scripts/mcp_installed_artifact_smoke.py `
            --hashmarks "$PWD\dist\hashmarks.exe"
          & scripts\windows_installer_smoke.ps1 `
            -Hashmarks "$PWD\dist\hashmarks.exe" `
            -Version $version
      - name: Bind native Windows standalone qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\qualified-windows | Out-Null
          Copy-Item dist\hashmarks.exe dist\qualified-windows\hashmarks-windows-x86_64.exe
          $asset = "dist\qualified-windows\hashmarks-windows-x86_64.exe"
          $checksum = "$asset.sha256"
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$digest  hashmarks-windows-x86_64.exe" -Encoding ascii
          & .venv\Scripts\python.exe scripts\release_contract.py standalone-qualification `
            --artifact $asset `
            --checksum $checksum `
            --platform windows `
            --architecture x86_64 `
            --output dist\qualified-windows\standalone-qualification.json
          & .venv\Scripts\python.exe scripts\release_contract.py verify-standalone-qualification `
            --bundle dist\qualified-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashmarks-standalone-windows-${{ github.sha }}
          path: dist/qualified-windows/
          if-no-files-found: error

  publication-rehearsal:
    name: Publication aggregation rehearsal
    needs: [release-environment, standalone-artifact, standalone-windows-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download qualified Python bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hashmarks-qualified-python-${{ github.sha }}
          path: rehearsal/
      - name: Download qualified Linux/WSL bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hashmarks-standalone-linux-${{ github.sha }}
          path: rehearsal/standalone/linux/
      - name: Download qualified Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hashmarks-standalone-windows-${{ github.sha }}
          path: rehearsal/standalone/windows/
      - name: Rehearse exact publication aggregation
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/release_contract.py verify \
            --root . \
            --dist rehearsal/packages \
            --tag "v$version" \
            --manifest rehearsal/package-manifest.json
          (cd rehearsal/packages && sha256sum -c ../PACKAGE_SHA256SUMS.txt)
          chmod 0755 rehearsal/standalone/linux/hashmarks-linux-x86_64
          python3 scripts/release_contract.py verify-standalone-qualification \
            --bundle rehearsal/standalone/linux
          python3 scripts/release_contract.py verify-standalone-qualification \
            --bundle rehearsal/standalone/windows
          test "$(rehearsal/standalone/linux/hashmarks-linux-x86_64 --version)" = \
            "hashmarks version $version"
          python3 scripts/release_contract.py publication-manifest \
            --root . \
            --dist rehearsal/packages \
            --standalone-bundle rehearsal/standalone/linux \
            --standalone-bundle rehearsal/standalone/windows \
            --tag "v$version" \
            --source-sha "$source_sha" \
            --output rehearsal/release-manifest.json \
            --sha256sums rehearsal/SHA256SUMS.txt
          python3 scripts/release_contract.py verify-publication \
            --root . \
            --dist rehearsal/packages \
            --standalone-bundle rehearsal/standalone/linux \
            --standalone-bundle rehearsal/standalone/windows \
            --tag "v$version" \
            --source-sha "$source_sha" \
            --manifest rehearsal/release-manifest.json
          rm -rf rehearsal/public
          python3 scripts/release_contract.py materialize-publication \
            --root . \
            --manifest rehearsal/release-manifest.json \
            --sha256sums rehearsal/SHA256SUMS.txt \
            --dist rehearsal/packages \
            --standalone-bundle rehearsal/standalone/linux \
            --standalone-bundle rehearsal/standalone/windows \
            --output-dir rehearsal/public
          python3 scripts/release_contract.py publication-assets \
            --manifest rehearsal/release-manifest.json \
            --output rehearsal/expected-assets.txt
          find rehearsal/public -maxdepth 1 -type f -printf '%f\n' |
            sort > rehearsal/actual-assets.txt
          diff -u rehearsal/expected-assets.txt rehearsal/actual-assets.txt

  precommit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Pre-commit correctness and hygiene diagnostic
        continue-on-error: true
        run: make precommit

  qualification-convergence:
    name: Qualification convergence
    if: always()
    needs:
      - formatting
      - ruff-debt
      - fast-gate
      - authority-diagnostics
      - evidence-binding-diagnostics
      - consumer-wheel-artifact
      - release-environment
      - python-support
      - mcp-interop
      - standalone-artifact
      - standalone-windows-artifact
      - publication-rehearsal
      - precommit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every authoritative qualification lane
        env:
          FORMATTING: ${{ needs.formatting.result }}
          RUFF_DEBT: ${{ needs.ruff-debt.result }}
          FAST_GATE: ${{ needs.fast-gate.result }}
          WORKSPACE_AUTHORITY: ${{ needs.authority-diagnostics.result }}
          EVIDENCE_BINDINGS: ${{ needs.evidence-binding-diagnostics.result }}
          CONSUMER_WHEEL: ${{ needs.consumer-wheel-artifact.result }}
          RELEASE_ENVIRONMENT: ${{ needs.release-environment.result }}
          PYTHON_SUPPORT: ${{ needs.python-support.result }}
          MCP_INTEROP: ${{ needs.mcp-interop.result }}
          STANDALONE_ARTIFACT: ${{ needs.standalone-artifact.result }}
          WINDOWS_STANDALONE: ${{ needs.standalone-windows-artifact.result }}
          PUBLICATION_REHEARSAL: ${{ needs.publication-rehearsal.result }}
          PRECOMMIT: ${{ needs.precommit.result }}
        run: |
          failed=0
          printf '%-24s %s (diagnostic only)\n' "FORMATTING" "$FORMATTING"
          for lane in             RUFF_DEBT             FAST_GATE             WORKSPACE_AUTHORITY             EVIDENCE_BINDINGS             CONSUMER_WHEEL             RELEASE_ENVIRONMENT             PYTHON_SUPPORT             MCP_INTEROP             STANDALONE_ARTIFACT             WINDOWS_STANDALONE             PUBLICATION_REHEARSAL             PRECOMMIT
          do
            result="${!lane}"
            printf '%-24s %s\n' "$lane" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          test "$failed" -eq 0

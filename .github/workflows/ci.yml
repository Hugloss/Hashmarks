name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: Relevant verification and native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Install locked verification toolchains once
        run: |
          uv sync --frozen --group test --group typing --extra mcp --python 3.11
          UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --frozen --only-group lint --python 3.11
      - name: Validate dependency, formatting, static and typing authority
        run: |
          uv lock --check
          git diff --check HEAD^1 HEAD --
          make compile
          make lint
          make typecheck
      - name: Validate changed release request
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$PR_BASE_SHA" HEAD -- .github/release-request.toml; then
            python3 scripts/release_contract.py validate-release-candidate --base-ref "$PR_BASE_SHA"
          fi
      - name: Admit candidate-scoped Hashmarks test membership
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "::error::Missing exact PR or merge-group base commit" >&2
              exit 2
            fi
            base="$(git rev-parse HEAD^)"
          fi
          uv run --frozen --offline --no-sync --group test python scripts/ci_verification.py \
            --base "$base" --output "$RUNNER_TEMP/hashmarks-ci-plan.json" \
            > "$RUNNER_TEMP/hashmarks-ci-paths.nul"
          test -s "$RUNNER_TEMP/hashmarks-ci-paths.nul"
          cat "$RUNNER_TEMP/hashmarks-ci-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute selected tests through native pytest
        shell: bash
        run: |
          set -euo pipefail
          xargs -0 -r uv run --frozen --offline --no-sync --group test \
            python -m pytest -q < "$RUNNER_TEMP/hashmarks-ci-paths.nul"
      - name: Prove installed wheel and sdist remain usable
        run: make artifact-check ARTIFACT_PYTHON=3.11
      - name: Smoke a real installed wheel through the official MCP SDK
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          uv venv --python 3.11 "$RUNNER_TEMP/mcp-venv"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python "$RUNNER_TEMP/mcp-venv/bin/python" "$wheel" "mcp==2.2.0"
          "$RUNNER_TEMP/mcp-venv/bin/python" -I scripts/mcp_installed_artifact_smoke.py \
            --hashmarks "$RUNNER_TEMP/mcp-venv/bin/hashmarks"
      - name: Preserve selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashmarks-ci-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hashmarks-ci-plan.json
          if-no-files-found: warn
          retention-days: 14

  qualification-convergence:
    name: Qualification convergence
    if: always()
    needs: [fast-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory verification stage
        env:
          FAST_GATE: ${{ needs.fast-gate.result }}
        run: test "$FAST_GATE" = success

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-environment:
    name: Release qualification environment (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group test --python 3.14
      - run: make test-profile
      - run: make artifact-check ARTIFACT_PYTHON=3.14

  python-support:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group test --python ${{ matrix.python }}
      - run: make test
      - run: make artifact-check ARTIFACT_PYTHON=${{ matrix.python }}

  uv-minimum:
    name: Minimum supported uv 0.10.0 / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group test --python 3.14
      - run: make test

  pytest-compatibility:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pytest: "pytest==8.4.0"
            label: "pytest minimum line"
          - python: "3.14"
            pytest: "pytest==8.4.0"
            label: "pytest minimum line"
          - python: "3.14"
            pytest: "pytest>=8.4"
            label: "pytest latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }} .venv-compat
      - run: uv pip install --python .venv-compat/bin/python -e . "${{ matrix.pytest }}"
      - run: .venv-compat/bin/python scripts/qualification_environment.py pytest
      - run: .venv-compat/bin/python -m pytest -q

  mcp-interop:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp>=2.2.0"
            label: "MCP latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python }} .mcp-venv
      - name: Install exact wheel and MCP compatibility line
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --python .mcp-venv/bin/python "$wheel" "${{ matrix.mcp }}"
      - name: Smoke installed wheel through official MCP SDK
        run: .mcp-venv/bin/python -I scripts/mcp_installed_artifact_smoke.py --hashmarks "$PWD/.mcp-venv/bin/hashmarks"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv run --only-group lint ruff check .
      - run: uv run --only-group lint ruff format --check .

  precommit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv run --only-group hooks pre-commit run --all-files

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --group test --python 3.11
      - run: make ruff
      - run: make lint-debt-gate
      - name: Materialize exact Agent Economics supply
        run: |
          bootstrap="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Hugloss/agentsCookbook/1b719d71acf742607658185ff9ee036d32cd75e0/scripts/bootstrap-agent-economics.sh \
            --output "$bootstrap"
          sh "$bootstrap" \
            --revision 1b719d71acf742607658185ff9ee036d32cd75e0 \
            --destination .agent-economics
      - name: Prove Agent Economics Ruff debt measurement parity
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv run --only-group lint python -m scripts.agent_evaluation.ruff_debt_agent_economics_parity
      - name: Dogfood Agent Economics test-before-edit handoff
        run: |
          PYTHONPATH="$PWD/.agent-economics/scripts:$PWD" uv run --no-sync python -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --package-name hashmarks \
            --tests-package-name tests \
            --changed-path hashmarks/codemap/task_action_projection.py \
            --artifact .agent-artifacts/task-action-projection-test-focus.json
      - run: make compile
      - name: Prove workspace-state authority before heavy qualification
        run: uv run --no-sync python -m pytest -q tests/test_codemap_state_binding.py

  release-environment:
    name: Release qualification environment (Python 3.14)
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group test --python 3.14
      - run: make test-profile
      - run: make artifact-check ARTIFACT_PYTHON=3.14

  python-support:
    name: Tests / Python ${{ matrix.python }}
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group test --python ${{ matrix.python }}
      - run: make test
      - run: make artifact-check ARTIFACT_PYTHON=${{ matrix.python }}

  mcp-interop:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.11"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp>=2.2.0"
            label: "MCP latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python }} .mcp-venv
      - name: Install exact wheel and MCP compatibility line
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --python .mcp-venv/bin/python "$wheel" "${{ matrix.mcp }}"
      - name: Smoke installed wheel through official MCP SDK
        run: .mcp-venv/bin/python -I scripts/mcp_installed_artifact_smoke.py --hashmarks "$PWD/.mcp-venv/bin/hashmarks"

  precommit:
    name: Pre-commit checks
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make precommit

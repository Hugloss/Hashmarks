name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-environment:
    name: Release qualification environment (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group test --python 3.14
      - run: make test-profile
      - run: make artifact-check ARTIFACT_PYTHON=3.14

  python-support:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group test --python ${{ matrix.python }}
      - run: make test
      - run: make artifact-check ARTIFACT_PYTHON=${{ matrix.python }}

  mcp-interop:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp>=2.2.0"
            label: "MCP latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python }} .mcp-venv
      - name: Install exact wheel and MCP compatibility line
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --python .mcp-venv/bin/python "$wheel" "${{ matrix.mcp }}"
      - name: Smoke installed wheel through official MCP SDK
        run: .mcp-venv/bin/python -I scripts/mcp_installed_artifact_smoke.py --hashmarks "$PWD/.mcp-venv/bin/hashmarks"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --group test --python 3.11
      - run: make ruff
      - name: Exact structural debt baseline
        run: uv run --offline --frozen --no-sync --group test python scripts/ruff_debt.py --write-baseline ruff-debt-current.json --summary-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-debt-current
          path: ruff-debt-current.json
          if-no-files-found: error
      - run: make lint-debt-gate

  precommit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make precommit

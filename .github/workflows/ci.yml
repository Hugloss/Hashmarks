name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --group test --python 3.11
      - name: Dogfood Agent Economics explicit Ruff threshold authority
        shell: bash
        run: |
          set -euo pipefail
          AE_REVISION=9943404998f1650c7e289a9f7d6eb76a5cbdb3be
          AE_ROOT="$RUNNER_TEMP/agent-economics"
          git clone --quiet https://github.com/Hugloss/agentsCookbook.git "$AE_ROOT"
          git -C "$AE_ROOT" checkout --quiet --detach "$AE_REVISION"
          test "$(git -C "$AE_ROOT" rev-parse HEAD)" = "$AE_REVISION"
          PYTHONPATH="$AE_ROOT/scripts" uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from agent_economics.quality_debt import quality_debt_audit
          limits = {
              "C901": 8, "PLR0911": 6, "PLR0912": 8, "PLR0913": 6,
              "PLR0914": 15, "PLR0915": 40, "PLR0916": 5,
          }
          result = quality_debt_audit(
              repository_root=Path("."),
              roots=("hashmarks", "scripts", "benchmarks"),
              excludes=("benchmarks/agent_evaluation/retained",),
              limits=limits,
          )
          argv = result["evidence"]["analyzer"]["analysis_argv"]
          expected = {
              "lint.mccabe.max-complexity = 8",
              "lint.pylint.max-returns = 6",
              "lint.pylint.max-branches = 8",
              "lint.pylint.max-args = 6",
              "lint.pylint.max-locals = 15",
              "lint.pylint.max-statements = 40",
              "lint.pylint.max-bool-expr = 5",
          }
          missing = sorted(expected - set(argv))
          if missing:
              raise SystemExit(f"missing explicit Ruff threshold authority: {missing}")
          print(json.dumps({
              "status": "PASS",
              "agent_economics_revision": AE_REVISION if False else "9943404998f1650c7e289a9f7d6eb76a5cbdb3be",
              "configured_plr0913_limit": limits["PLR0913"],
              "findings": len(result["evidence"]["detailed_findings"]),
              "explicit_thresholds": sorted(expected),
          }, sort_keys=True))
          PY
      - run: make ruff
      - run: make lint-debt-gate
      - run: make compile
      - name: Prove workspace-state authority before heavy qualification
        run: uv run --no-sync python -m pytest -q tests/test_codemap_state_binding.py

  release-environment:
    name: Release qualification environment (Python 3.14)
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group test --python 3.14
      - run: make test-profile
      - run: make artifact-check ARTIFACT_PYTHON=3.14

  python-support:
    name: Tests / Python ${{ matrix.python }}
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group test --python ${{ matrix.python }}
      - run: make test
      - run: make artifact-check ARTIFACT_PYTHON=${{ matrix.python }}

  mcp-interop:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.11"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp==2.2.0"
            label: "MCP minimum line"
          - python: "3.14"
            mcp: "mcp>=2.2.0"
            label: "MCP latest supported"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python ${{ matrix.python }} .mcp-venv
      - name: Install exact wheel and MCP compatibility line
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv pip install --python .mcp-venv/bin/python "$wheel" "${{ matrix.mcp }}"
      - name: Smoke installed wheel through official MCP SDK
        run: .mcp-venv/bin/python -I scripts/mcp_installed_artifact_smoke.py --hashmarks "$PWD/.mcp-venv/bin/hashmarks"

  precommit:
    name: Pre-commit checks
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make precommit

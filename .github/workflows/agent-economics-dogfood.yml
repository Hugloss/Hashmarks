name: Agent Economics dogfood

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity-evidence:
    if: github.head_ref == 'ruff-complexity-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Install Hashmarks Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11

      - name: Checkout exact agentsCookbook authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hugloss/agentsCookbook
          ref: ab44164f2616791336411ec8552f00b2910c76b2
          path: .agentsCookbook
          persist-credentials: false

      - name: Agent Economics quality-debt
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          python3 -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/quality-debt.json \
            --format json

      - name: Raw Ruff target diagnostics
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          ruff check \
            hashmarks/qualification_units.py \
            hashmarks/codemap/work_context.py \
            --preview \
            --isolated \
            --select C901,PLR0911,PLR0912,PLR0913,PLR0914,PLR0915,PLR0916 \
            --config 'lint.per-file-ignores = {}' \
            --config 'lint.mccabe.max-complexity = 8' \
            --config 'lint.pylint.max-returns = 6' \
            --config 'lint.pylint.max-branches = 8' \
            --config 'lint.pylint.max-args = 6' \
            --config 'lint.pylint.max-locals = 15' \
            --config 'lint.pylint.max-statements = 40' \
            --config 'lint.pylint.max-bool-expr = 5' \
            --output-format concise || true

      - name: Compare broad and targeted Ruff JSON
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          COMMON=(--preview --select C901,PLR0911,PLR0912,PLR0913,PLR0914,PLR0915,PLR0916 --isolated --config 'lint.per-file-ignores = {}' --config 'lint.mccabe.max-complexity = 8' --config 'lint.pylint.max-returns = 6' --config 'lint.pylint.max-branches = 8' --config 'lint.pylint.max-args = 6' --config 'lint.pylint.max-locals = 15' --config 'lint.pylint.max-statements = 40' --config 'lint.pylint.max-bool-expr = 5' --output-format json)
          .ruff-venv/bin/ruff check hashmarks scripts benchmarks "${COMMON[@]}" --exclude benchmarks/agent_evaluation/retained > /tmp/broad.json || true
          .ruff-venv/bin/ruff check hashmarks/qualification_units.py hashmarks/codemap/work_context.py "${COMMON[@]}" > /tmp/target.json || true
          python3 - <<'PY'
          import json
          from collections import Counter
          for name in ("broad", "target"):
              rows = json.load(open(f"/tmp/{name}.json"))
              wanted = [row for row in rows if row["filename"].endswith(("hashmarks/qualification_units.py", "hashmarks/codemap/work_context.py"))]
              print(name, "total", len(rows), "wanted", len(wanted))
              print(name, Counter((row["code"], row["filename"].split("/Hashmarks/")[-1], row["location"]["row"]) for row in wanted))
          PY

      - name: Agent Economics test-focus
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --changed-path hashmarks/codemap/repository_evidence_coverage.py \
            --changed-path hashmarks/qualification_units.py \
            --changed-path hashmarks/codemap/work_context.py \
            --changed-path hashmarks/codemap/indexing_lifecycle.py \
            --package-name hashmarks \
            --gate 'repository=make test' \
            --artifact .agent-artifacts/test-focus.json \
            --format json

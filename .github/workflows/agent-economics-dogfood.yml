name: Agent Economics dogfood

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity-evidence:
    if: github.head_ref == 'ruff-complexity-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Install Hashmarks Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11

      - name: Install focused test supply
        run: UV_PROJECT_ENVIRONMENT=.test-venv uv sync --only-group test --python 3.11

      - name: Checkout qualified agentsCookbook authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hugloss/agentsCookbook
          ref: cd869bbbe28c7fa5bc55dc7e2e5011de23df44e4
          path: .agentsCookbook
          persist-credentials: false

      - name: Agent Economics quality-debt
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          python3 -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/quality-debt.json \
            --format json

      - name: Agent Economics test-focus
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --changed-path hashmarks/codemap/repository_evidence_coverage.py \
            --changed-path hashmarks/codemap/repository_evidence_binding_delta.py \
            --changed-path hashmarks/codemap/query_surface.py \
            --changed-path hashmarks/codemap/task_action_projection.py \
            --changed-path hashmarks/codemap/task_action_owner_resolution.py \
            --changed-path hashmarks/codemap/indexing_lifecycle.py \
            --changed-path hashmarks/codemap/structural_locality.py \
            --package-name hashmarks \
            --gate 'repository=make test' \
            --artifact .agent-artifacts/test-focus.json \
            --format json
      
      - name: Assert structural locality direct test ownership
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(".agent-artifacts/test-focus.json").read_text(encoding="utf-8")
          )
          target = "hashmarks/codemap/structural_locality.py"
          candidates = [
              row for row in payload.get("candidates", [])
              if row.get("target") == target
          ]
          if len(candidates) != 1:
              raise SystemExit(f"missing exact test-focus candidate for {target}")
          confirmed = candidates[0].get("evidence", {}).get("confirmed", [])
          owners = {
              row.get("test_path")
              for row in confirmed
              if row.get("match_type") == "import_exact"
          }
          required = "tests/test_structural_locality.py"
          if required not in owners:
              raise SystemExit(
                  f"static re-export direct ownership not recovered: {sorted(owners)}"
              )
          if any(
              item.get("code") == "direct_test_ownership_missing"
              for item in candidates[0].get("uncertainty", [])
          ):
              raise SystemExit("structural locality still reports missing direct ownership")
          print(json.dumps({"target": target, "confirmed_direct_owners": sorted(owners)}))
          PY

      - name: Focused branch coverage - binding delta
        run: |
          UV_PROJECT_ENVIRONMENT=.test-venv uv run --only-group test pytest \
            tests/test_repository_evidence_bindings.py \
            --cov=hashmarks.codemap.repository_evidence_binding_delta \
            --cov-branch \
            --cov-report=term-missing:skip-covered

      - name: Focused branch coverage - structural locality
        run: |
          UV_PROJECT_ENVIRONMENT=.test-venv uv run --only-group test pytest \
            tests/test_structural_locality.py \
            --cov=hashmarks.codemap.structural_locality \
            --cov-branch \
            --cov-report=term-missing:skip-covered

      - name: Create current-source Hashmarks observer executable
        run: |
          cat > "$RUNNER_TEMP/hashmarks-current-observer" <<'PY'
          #!/usr/bin/env python3
          import os
          import sys

          workspace = os.environ["GITHUB_WORKSPACE"]
          sys.path = [
              entry
              for entry in sys.path
              if entry not in {"", os.getcwd(), workspace}
          ]
          sys.path.insert(0, workspace)
          from hashmarks.cli import main

          raise SystemExit(main())
          PY
          chmod +x "$RUNNER_TEMP/hashmarks-current-observer"

      - name: Checkout exact binding-delta pre-edit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 50b0e3be83fc0dd445bae9494367ece2f25179fe
          path: .binding-before
          persist-credentials: false

      - name: Measure exact pre-edit binding-delta debt
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          export PATH="$GITHUB_WORKSPACE/.ruff-venv/bin:$PATH"
          python3 -m agent_economics quality-debt \
            --repository-root "$GITHUB_WORKSPACE/.binding-before" \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact "$RUNNER_TEMP/binding-quality-debt-before.json" \
            --format json

      - name: Recover exact pre-edit test ownership
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics test-focus \
            --repository-root "$GITHUB_WORKSPACE/.binding-before" \
            --source-root hashmarks \
            --tests-root tests \
            --changed-path hashmarks/codemap/repository_evidence_binding_delta.py \
            --package-name hashmarks \
            --gate 'repository=UV_PROJECT_ENVIRONMENT=.test-venv make test-native' \
            --artifact "$RUNNER_TEMP/binding-test-focus-before.json" \
            --format json

      - name: Execute frozen pre-edit binding tests
        run: |
          (
            cd "$GITHUB_WORKSPACE/.binding-before"
            "$GITHUB_WORKSPACE/.test-venv/bin/python" -m pytest -q \
              tests/test_repository_evidence_bindings.py
          )

      - name: Freeze BP1 binding-delta evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from agent_economics.behavior_preservation import (
              behavior_preservation_readiness,
              target_test_ownership_evidence,
          )

          runner = Path(os.environ["RUNNER_TEMP"])
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".binding-before"
          target = "hashmarks/codemap/repository_evidence_binding_delta.py"
          test_path = "tests/test_repository_evidence_bindings.py"

          def file_identity(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def object_identity(payload: object) -> str:
              encoded = json.dumps(
                  payload, sort_keys=True, separators=(",", ":")
              ).encode()
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          source_identity = file_identity(root / target)
          test_identity = file_identity(root / test_path)
          test_references = [
              {"path": test_path, "evidence_identity": test_identity}
          ]
          focus = json.loads(
              (runner / "binding-test-focus-before.json").read_text(encoding="utf-8")
          )
          candidates = [
              row for row in focus.get("candidates", [])
              if row.get("target") == target
          ]
          if len(candidates) != 1:
              raise SystemExit("pre-edit binding-delta test-focus candidate missing")
          confirmed = candidates[0].get("evidence", {}).get("confirmed", [])
          if test_path not in {
              row.get("test_path") for row in confirmed
          }:
              raise SystemExit("pre-edit binding-delta direct test ownership missing")
          focus_identity = object_identity(focus)
          ownership = target_test_ownership_evidence(
              target=target,
              source_identity=source_identity,
              test_references=test_references,
              provider="test-focus",
              provider_evidence_identity=focus_identity,
          )
          boundaries = [
              "binding-set-membership-and-ordering",
              "member-observation-transition-classification",
              "dependency-and-relationship-evidence-separation",
              "malformed-input-and-repository-mismatch-fail-closed",
          ]
          boundary_rows = [
              {
                  "identity": name,
                  "classification": "direct",
                  "freshness": "fresh",
                  "provider_reference": {
                      "provider": "repository-characterization-tests",
                      "evidence_identity": test_identity,
                  },
                  "test_evidence_identities": [test_identity],
              }
              for name in boundaries
          ]
          execution_semantic = {
              "source_identity": source_identity,
              "status": "PASS",
              "test_evidence_identities": [test_identity],
              "command": (
                  "$GITHUB_WORKSPACE/.test-venv/bin/python -m pytest -q "
                  "tests/test_repository_evidence_bindings.py"
              ),
              "pre_edit_commit": "50b0e3be83fc0dd445bae9494367ece2f25179fe",
          }
          execution_receipt = {
              "source_identity": source_identity,
              "status": "PASS",
              "test_evidence_identities": [test_identity],
              "execution_identity": object_identity(execution_semantic),
          }
          bp1 = behavior_preservation_readiness(
              target=target,
              source_identity=source_identity,
              boundaries=boundary_rows,
              test_references=test_references,
              execution_receipt=execution_receipt,
              repository_gates=[
                  {
                      "name": "repository",
                      "command": "UV_PROJECT_ENVIRONMENT=.test-venv make test-native",
                  }
              ],
              test_ownership_evidence=ownership,
          )
          print(json.dumps(bp1, indent=2, sort_keys=True))
          if bp1["status"] != "READY_FOR_BEHAVIOR_PRESERVING_EDIT":
              raise SystemExit("binding-delta BP1 evidence is not READY")
          (runner / "binding-bp1.json").write_text(
              json.dumps(bp1, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Observe pre-edit binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root "$GITHUB_WORKSPACE/.binding-before" \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --max-depth 2 \
            --artifact "$RUNNER_TEMP/binding-locality-before-depth2.json"

      - name: Diagnose pre-edit locality completeness
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "binding-locality-before-depth2.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              json.dumps(
                  {
                      "unresolved_calls": payload["packet"].get("unresolved_calls", []),
                      "snapshot_unresolved_evidence": payload["snapshot"].get(
                          "unresolved_evidence", []
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          if any(
              row.get("source_symbol_id") == packet.get("target_symbol_id")
              for row in packet.get("unresolved_calls", [])
          ):
              raise SystemExit(
                  "direct binding-delta calls remain unresolved at the target boundary"
              )
          PY

      - name: Observe pre-edit binding-delta comparison scope
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root "$GITHUB_WORKSPACE/.binding-before" \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --max-depth 1 \
            --artifact "$RUNNER_TEMP/binding-locality-before-observed.json"

      - name: Observe post-edit binding-delta locality identity
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root . \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --max-depth 1 \
            --artifact "$RUNNER_TEMP/binding-locality-post-seed.json"

      - name: Bind semantic responsibility evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["RUNNER_TEMP"])
          observed = json.loads(
              (artifact / "binding-locality-post-seed.json").read_text(encoding="utf-8")
          )
          repository_identity = observed["packet"]["repository_identity"]
          responsibilities = {
              "RepositoryEvidenceBindingDeltaMixin._direct_locator_evidence_changes":
                  "Owns direct-content and locator-state delta classification.",
              "RepositoryEvidenceBindingDeltaMixin._member_evidence_changes":
                  "Owns repository-member observation transition classification.",
              "RepositoryEvidenceBindingDeltaMixin._comparable_relationship_evidence":
                  "Owns comparable relationship fact and locator delta projection.",
              "RepositoryEvidenceBindingDeltaMixin._relationship_evidence_delta":
                  "Owns relationship observation comparability and completeness projection.",
          }
          values = []
          for qualname, summary in responsibilities.items():
              identity = "sha256:" + hashlib.sha256(summary.encode("utf-8")).hexdigest()
              values.append(
                  {
                      "symbol_id": (
                          "hashmarks/codemap/repository_evidence_binding_delta.py::"
                          + qualname
                      ),
                      "structure_kind": "implementation",
                      "value_kind": "semantic_responsibility_owner",
                      "repository_identity": repository_identity,
                      "evidence_provider": "repository-refactor-audit",
                      "evidence_identity": identity,
                      "edit_required": True,
                  }
              )
          (artifact / "binding-structural-values.json").write_text(
              json.dumps(values, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          evidence_rows = []
          for kind, summary in [
              (
                  "mixed_responsibilities",
                  "_binding_change previously combined direct/locator, member, dependency, relationship, and definition delta responsibilities.",
              ),
              (
                  "bounded_locality_tradeoff",
                  "The cohesive module keeps one owner while same-file semantic stages make each delta responsibility explicit.",
              ),
          ]:
              evidence_rows.append(
                  {
                      "kind": kind,
                      "evidence_identity": "sha256:"
                      + hashlib.sha256(summary.encode("utf-8")).hexdigest(),
                      "summary": summary,
                  }
              )
          (artifact / "binding-decomposition-evidence.json").write_text(
              json.dumps(evidence_rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Observe valued post-edit binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root . \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --max-depth 1 \
            --values "$RUNNER_TEMP/binding-structural-values.json" \
            --artifact "$RUNNER_TEMP/binding-locality-post-observed.json"

      - name: Compare binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["RUNNER_TEMP"])
          for source, target in [
              ("binding-locality-before-observed.json", "binding-locality-before.json"),
              ("binding-locality-post-observed.json", "binding-locality-post.json"),
          ]:
              payload = json.loads((artifact / source).read_text(encoding="utf-8"))
              (artifact / target).write_text(
                  json.dumps(payload["snapshot"], indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          python3 -m agent_economics refactor-locality compare \
            "$RUNNER_TEMP/binding-locality-before.json" \
            "$RUNNER_TEMP/binding-locality-post.json" \
            --evidence "$RUNNER_TEMP/binding-decomposition-evidence.json" \
            --artifact "$RUNNER_TEMP/binding-locality-decision.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "binding-locality-decision.json").read_text(
                  encoding="utf-8"
              )
          )
          comparison = payload["comparison"]
          decision = payload["decision"]
          print(json.dumps(payload, indent=2, sort_keys=True))
          if comparison["unjustified_new_structures"]:
              raise SystemExit(
                  "new binding-delta structure lacks semantic value evidence"
              )
          if decision["status"] != "DECOMPOSITION_JUSTIFIED":
              raise SystemExit(
                  "binding-delta decomposition did not earn locality closure: "
                  + str(decision["status"])
              )
          PY


      - name: Run post-edit repository test gate
        run: UV_PROJECT_ENVIRONMENT=.test-venv make test-native

      - name: Close BP2 locality and debt delta
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from agent_economics.behavior_preservation import (
              behavior_preservation_debt_delta,
              behavior_preservation_receipt,
              post_edit_change_set_evidence,
              source_set_identity,
          )

          root = Path(os.environ["GITHUB_WORKSPACE"])
          runner = Path(os.environ["RUNNER_TEMP"])
          target = "hashmarks/codemap/repository_evidence_binding_delta.py"
          test_path = "tests/test_repository_evidence_bindings.py"
          pre_commit = "50b0e3be83fc0dd445bae9494367ece2f25179fe"

          def file_identity(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def object_identity(payload: object) -> str:
              encoded = json.dumps(
                  payload, sort_keys=True, separators=(",", ":")
              ).encode()
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          bp1 = json.loads((runner / "binding-bp1.json").read_text(encoding="utf-8"))
          pre_debt = json.loads(
              (runner / "binding-quality-debt-before.json").read_text(encoding="utf-8")
          )
          post_debt = json.loads(
              (root / ".agent-artifacts/quality-debt.json").read_text(encoding="utf-8")
          )
          locality_payload = json.loads(
              (runner / "binding-locality-decision.json").read_text(encoding="utf-8")
          )
          post_snapshot = json.loads(
              (runner / "binding-locality-post.json").read_text(encoding="utf-8")
          )
          decision = locality_payload["decision"]
          post_repository_identity = post_snapshot["repository_identity"]

          frozen_test_identity = bp1["test_references"][0]["evidence_identity"]
          post_test_identity = file_identity(root / test_path)
          if post_test_identity != frozen_test_identity:
              raise SystemExit("frozen binding-delta test bytes changed after BP1")

          changed = subprocess.run(
              ["git", "diff", "--name-only", pre_commit, "HEAD", "--", "hashmarks"],
              cwd=root,
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          changed_sources = sorted(
              path for path in changed
              if path.startswith("hashmarks/") and path.endswith(".py")
          )
          if changed_sources != [target]:
              raise SystemExit(
                  "binding-delta production source set is not exact: "
                  + repr(changed_sources)
              )

          post_source_references = [
              {"path": target, "evidence_identity": file_identity(root / target)}
          ]
          post_source_identity = source_set_identity(post_source_references)
          change_set_semantic = {
              "pre_commit": pre_commit,
              "post_commit": subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  cwd=root,
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip(),
              "changed_production_sources": changed_sources,
          }
          change_set = post_edit_change_set_evidence(
              pre_edit_source_identity=bp1["source_identity"],
              post_edit_repository_identity=post_repository_identity,
              changed_source_references=post_source_references,
              provider="git-diff",
              provider_evidence_identity=object_identity(change_set_semantic),
          )
          focused_execution = {
              "source_identity": post_source_identity,
              "repository_identity": post_repository_identity,
              "status": "PASS",
              "test_evidence_identities": [post_test_identity],
              "execution_identity": object_identity(
                  {
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "commit": os.environ.get("GITHUB_SHA"),
                      "command": (
                          "pytest tests/test_repository_evidence_bindings.py "
                          "--cov=hashmarks.codemap.repository_evidence_binding_delta "
                          "--cov-branch"
                      ),
                      "source_identity": post_source_identity,
                      "test_identity": post_test_identity,
                  }
              ),
          }
          gate_command = "UV_PROJECT_ENVIRONMENT=.test-venv make test-native"
          gate_receipts = [
              {
                  "name": "repository",
                  "command": gate_command,
                  "status": "PASS",
                  "repository_identity": post_repository_identity,
                  "execution_identity": object_identity(
                      {
                          "run_id": os.environ.get("GITHUB_RUN_ID"),
                          "commit": os.environ.get("GITHUB_SHA"),
                          "command": gate_command,
                          "repository_identity": post_repository_identity,
                      }
                  ),
              }
          ]
          bp2 = behavior_preservation_receipt(
              pre_edit_evidence=bp1,
              post_edit_source_identity=post_source_identity,
              post_edit_repository_identity=post_repository_identity,
              post_edit_source_references=post_source_references,
              post_edit_change_set_evidence=change_set,
              post_edit_test_references=[
                  {"path": test_path, "evidence_identity": post_test_identity}
              ],
              post_edit_execution_receipt=focused_execution,
              repository_gate_receipts=gate_receipts,
          )
          if bp2["status"] != "BEHAVIOR_PRESERVATION_VERIFIED":
              print(json.dumps(bp2, indent=2, sort_keys=True))
              raise SystemExit("binding-delta BP2 preservation did not verify")

          def measurement_identity(payload: object) -> str:
              return object_identity(payload)

          pre_summary = pre_debt["derived"]["summary"]
          post_summary = post_debt["derived"]["summary"]
          pre_target = pre_summary["files"].get(target, {}).get("excess", 0)
          post_target = post_summary["files"].get(target, {}).get("excess", 0)
          closure = behavior_preservation_debt_delta(
              target=target,
              pre_measurement_identity=measurement_identity(pre_debt),
              post_measurement_identity=measurement_identity(post_debt),
              measurement_configuration_identity=pre_debt["evidence"]["comparable_identity"],
              post_measurement_configuration_identity=post_debt["evidence"]["comparable_identity"],
              pre_repository_excess=pre_summary["excess"],
              post_repository_excess=post_summary["excess"],
              pre_target_excess=pre_target,
              post_target_excess=post_target,
              preservation_receipt=bp2,
              locality_decision=decision,
              post_locality_snapshot=post_snapshot,
          )
          print(
              json.dumps(
                  {"bp2": bp2, "debt_closure": closure},
                  indent=2,
                  sort_keys=True,
              )
          )
          if closure["status"] != "VERIFIED":
              raise SystemExit(
                  "binding-delta cleanup closure is not VERIFIED: "
                  + str(closure["status"])
              )
          (runner / "binding-bp2.json").write_text(
              json.dumps(bp2, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (runner / "binding-debt-closure.json").write_text(
              json.dumps(closure, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

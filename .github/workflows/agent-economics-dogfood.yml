name: Agent Economics dogfood

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity-evidence:
    if: github.head_ref == 'ruff-complexity-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Install Hashmarks Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11

      - name: Install focused test supply
        run: UV_PROJECT_ENVIRONMENT=.test-venv uv sync --only-group test --python 3.11

      - name: Checkout qualified agentsCookbook authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hugloss/agentsCookbook
          ref: e32c6930c83fbdf124252afa68eaa48935f876d6
          path: .agentsCookbook
          persist-credentials: false

      - name: Agent Economics quality-debt
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          python3 -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/quality-debt.json \
            --format json

      - name: Agent Economics test-focus
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --changed-path hashmarks/codemap/repository_evidence_coverage.py \
            --changed-path hashmarks/codemap/repository_evidence_binding_delta.py \
            --changed-path hashmarks/codemap/query_surface.py \
            --changed-path hashmarks/codemap/task_action_projection.py \
            --changed-path hashmarks/codemap/task_action_owner_resolution.py \
            --changed-path hashmarks/codemap/indexing_lifecycle.py \
            --changed-path hashmarks/codemap/structural_locality.py \
            --package-name hashmarks \
            --gate 'repository=make test' \
            --artifact .agent-artifacts/test-focus.json \
            --format json
      
      - name: Focused branch coverage - binding delta
        run: |
          UV_PROJECT_ENVIRONMENT=.test-venv uv run --only-group test pytest \
            tests/test_repository_evidence_bindings.py \
            --cov=hashmarks.codemap.repository_evidence_binding_delta \
            --cov-branch \
            --cov-report=term-missing:skip-covered

      - name: Focused branch coverage - structural locality
        run: |
          UV_PROJECT_ENVIRONMENT=.test-venv uv run --only-group test pytest \
            tests/test_structural_locality.py \
            --cov=hashmarks.codemap.structural_locality \
            --cov-branch \
            --cov-report=term-missing:skip-covered

      - name: Create current-source Hashmarks observer executable
        run: |
          cat > "$RUNNER_TEMP/hashmarks-current-observer" <<'PY'
          #!/usr/bin/env python3
          import os
          import sys

          workspace = os.environ["GITHUB_WORKSPACE"]
          sys.path = [
              entry
              for entry in sys.path
              if entry not in {"", os.getcwd(), workspace}
          ]
          sys.path.insert(0, workspace)
          from hashmarks.cli import main

          raise SystemExit(main())
          PY
          chmod +x "$RUNNER_TEMP/hashmarks-current-observer"

      - name: Checkout exact binding-delta pre-edit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 50b0e3be83fc0dd445bae9494367ece2f25179fe
          path: .binding-before
          persist-credentials: false

      - name: Observe pre-edit binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root "$GITHUB_WORKSPACE/.binding-before" \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --artifact "$RUNNER_TEMP/binding-locality-before-observed.json"

      - name: Diagnose pre-edit locality completeness
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "binding-locality-before-observed.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              json.dumps(
                  {
                      "unresolved_calls": payload["packet"].get("unresolved_calls", []),
                      "snapshot_unresolved_evidence": payload["snapshot"].get(
                          "unresolved_evidence", []
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Report pre-edit locality incompleteness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(".agent-artifacts/binding-locality-before-observed.json").read_text(
                  encoding="utf-8"
              )
          )
          packet = payload["packet"]
          print(
              json.dumps(
                  {
                      "target": packet.get("target"),
                      "unresolved_calls": packet.get("unresolved_calls"),
                      "external_or_unindexed_calls": packet.get(
                          "external_or_unindexed_calls"
                      ),
                      "dimensions": packet.get("dimensions"),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Observe post-edit binding-delta locality identity
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root . \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --artifact "$RUNNER_TEMP/binding-locality-post-seed.json"

      - name: Bind semantic responsibility evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["RUNNER_TEMP"])
          observed = json.loads(
              (artifact / "binding-locality-post-seed.json").read_text(encoding="utf-8")
          )
          repository_identity = observed["packet"]["repository_identity"]
          responsibilities = {
              "RepositoryEvidenceBindingDeltaMixin._direct_locator_evidence_changes":
                  "Owns direct-content and locator-state delta classification.",
              "RepositoryEvidenceBindingDeltaMixin._member_evidence_changes":
                  "Owns repository-member observation transition classification.",
              "RepositoryEvidenceBindingDeltaMixin._comparable_relationship_evidence":
                  "Owns comparable relationship fact and locator delta projection.",
              "RepositoryEvidenceBindingDeltaMixin._relationship_evidence_delta":
                  "Owns relationship observation comparability and completeness projection.",
          }
          values = []
          for qualname, summary in responsibilities.items():
              identity = "sha256:" + hashlib.sha256(summary.encode("utf-8")).hexdigest()
              values.append(
                  {
                      "symbol_id": (
                          "hashmarks/codemap/repository_evidence_binding_delta.py::"
                          + qualname
                      ),
                      "structure_kind": "implementation",
                      "value_kind": "semantic_responsibility_owner",
                      "repository_identity": repository_identity,
                      "evidence_provider": "repository-refactor-audit",
                      "evidence_identity": identity,
                      "edit_required": True,
                  }
              )
          (artifact / "binding-structural-values.json").write_text(
              json.dumps(values, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          evidence_rows = []
          for kind, summary in [
              (
                  "mixed_responsibilities",
                  "_binding_change previously combined direct/locator, member, dependency, relationship, and definition delta responsibilities.",
              ),
              (
                  "bounded_locality_tradeoff",
                  "The cohesive module keeps one owner while same-file semantic stages make each delta responsibility explicit.",
              ),
          ]:
              evidence_rows.append(
                  {
                      "kind": kind,
                      "evidence_identity": "sha256:"
                      + hashlib.sha256(summary.encode("utf-8")).hexdigest(),
                      "summary": summary,
                  }
              )
          (artifact / "binding-decomposition-evidence.json").write_text(
              json.dumps(evidence_rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Observe valued post-edit binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics refactor-locality observe-hashmarks \
            'hashmarks/codemap/repository_evidence_binding_delta.py::RepositoryEvidenceBindingDeltaMixin._binding_change' \
            --repository-root . \
            --hashmarks-executable "$RUNNER_TEMP/hashmarks-current-observer" \
            --values "$RUNNER_TEMP/binding-structural-values.json" \
            --artifact "$RUNNER_TEMP/binding-locality-post-observed.json"

      - name: Compare binding-delta locality
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["RUNNER_TEMP"])
          for source, target in [
              ("binding-locality-before-observed.json", "binding-locality-before.json"),
              ("binding-locality-post-observed.json", "binding-locality-post.json"),
          ]:
              payload = json.loads((artifact / source).read_text(encoding="utf-8"))
              (artifact / target).write_text(
                  json.dumps(payload["snapshot"], indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          python3 -m agent_economics refactor-locality compare \
            "$RUNNER_TEMP/binding-locality-before.json" \
            "$RUNNER_TEMP/binding-locality-post.json" \
            --evidence "$RUNNER_TEMP/binding-decomposition-evidence.json" \
            --artifact "$RUNNER_TEMP/binding-locality-decision.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "binding-locality-decision.json").read_text(
                  encoding="utf-8"
              )
          )
          comparison = payload["comparison"]
          decision = payload["decision"]
          print(json.dumps(payload, indent=2, sort_keys=True))
          if comparison["unjustified_new_structures"]:
              raise SystemExit(
                  "new binding-delta structure lacks semantic value evidence"
              )
          if decision["status"] != "DECOMPOSITION_JUSTIFIED":
              raise SystemExit(
                  "binding-delta decomposition did not earn locality closure: "
                  + str(decision["status"])
              )
          PY


name: Agent Economics dogfood

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity-evidence:
    if: github.head_ref == 'ruff-complexity-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Install Hashmarks Ruff supply
        run: UV_PROJECT_ENVIRONMENT=.ruff-venv uv sync --only-group lint --python 3.11

      - name: Checkout qualified agentsCookbook authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hugloss/agentsCookbook
          ref: 3ebcd0c9bcf852f00b4ed89d5a716ed11c970eae
          path: .agentsCookbook
          persist-credentials: false

      - name: Agent Economics quality-debt
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          export PATH="$PWD/.ruff-venv/bin:$PATH"
          python3 -m agent_economics quality-debt \
            --repository-root . \
            --root hashmarks \
            --root scripts \
            --root benchmarks \
            --exclude benchmarks/agent_evaluation/retained \
            --limit C901=8 \
            --limit PLR0911=6 \
            --limit PLR0912=8 \
            --limit PLR0913=6 \
            --limit PLR0914=15 \
            --limit PLR0915=40 \
            --limit PLR0916=5 \
            --max-file-lines 1600 \
            --file-line-root hashmarks \
            --artifact .agent-artifacts/quality-debt.json \
            --format json

      - name: Agent Economics test-focus
        env:
          PYTHONPATH: ${{ github.workspace }}/.agentsCookbook/scripts
        run: |
          python3 -m agent_economics test-focus \
            --repository-root . \
            --source-root hashmarks \
            --tests-root tests \
            --changed-path hashmarks/codemap/repository_evidence_coverage.py \
            --changed-path hashmarks/codemap/repository_evidence_binding_delta.py \
            --changed-path hashmarks/codemap/query_surface.py \
            --changed-path hashmarks/codemap/task_action_projection.py \
            --changed-path hashmarks/codemap/task_action_owner_resolution.py \
            --changed-path hashmarks/codemap/indexing_lifecycle.py \
            --package-name hashmarks \
            --gate 'repository=make test' \
            --artifact .agent-artifacts/test-focus.json \
            --format json

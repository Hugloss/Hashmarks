name: Lock bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate initial uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv lock
      - name: Commit initial lockfile to PR branch
        shell: bash
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f uv.lock
          git commit -m "Commit uv.lock resolution authority"
          git push origin HEAD:${{ github.head_ref }}

[build-system]
requires = []
build-backend = "hashmarks_build"
backend-path = ["."]

[project]
name = "hashmarks"
version = "0.19.0"
description = "Local repository intelligence and a read-only MCP server for coding agents: codebase search, repository context, code navigation, ownership, change impact, freshness, and verification evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "repository-intelligence",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "coding-agents",
    "ai-coding",
    "ai-agents",
    "codebase-search",
    "code-navigation",
    "code-analysis",
    "code-intelligence",
    "repository-analysis",
    "repository-context",
    "codebase-context",
    "code-ownership",
    "local-mcp-server",
    "verification-evidence",
    "change-impact",
    "impact-analysis",
    "dependency-analysis",
    "codemap",
    "developer-tools",
    "static-analysis",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2.0"]

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
]
lint = ["ruff>=0.12.0"]
typing = [{ include-group = "test" }, "ty", "pyright", "mcp>=2.2.0", "watchdog"]
hooks = ["pre-commit"]

[tool.uv]
required-version = ">=0.10.0"

[project.scripts]
hashmarks = "hashmarks.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "certification: native/release authority tests excluded from constrained-host diagnostics",
    "host_dns: requires external DNS/network access",
    "host_mcp_sdk: requires the optional official MCP SDK",
    "host_console_script: requires the Hashmarks console script installed beside the test interpreter",
    "host_git: requires the git executable",
    "slow: intentionally slow diagnostic or empirical test",
    "scale: intentionally large scale/benchmark test",
]

[tool.ruff]
force-exclude = true
required-version = "==0.16.8"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E4",
    "E7",
    "E9",
    "I",
    "T201",  # print statements; command output uses the repository logger adapter
    "C901",  # excessive cyclomatic complexity
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0914",  # too many local variables
    "PLR0915",  # too many statements
    "PLR0916",  # overly complicated boolean expressions
    # plus the repository's file-size limit
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 8
max-args = 6
max-locals = 15
max-statements = 40
max-bool-expr = 5

[tool.hashmarks.quality]
# Ruff has function-complexity rules but no repository module-length rule.
# Start with a hard ceiling above the current largest production module and
# ratchet it downward as large modules are split.
max-python-file-lines = 1600

[tool.pyright]
include = ["hashmarks", "scripts", "tests", "examples", "benchmarks", "hashmarks_build.py"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
